<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.js"></script>
<script>
const FOCUS_ID = new URLSearchParams(location.search).get('lo') || '';

// ---------- Trạng thái ----------
let DATA = null, dataVer = null;            // { ho:{headers, rows:{MaHo: farm}}, lo:{headers, rows:[plot]}, user, cfg }
let C = null;               // DATA.cfg
let byId = {};              // MaLo -> lô
let layerById = {};
let sel = null;
let dirtyLo = {}, dirtyHo = {};
let geomEdit = null, geomChanged = false, geomRemoved = false;
let PT = null;                       // { marker } khi đang sửa vị trí điểm (Sửa Point)
let importLayer = null, importItems = [];
let firstLoad = true;
let filter = {};            // { RA: true, '4C': true, CP: true, none: true }

const PROG_COLOR = { RA: '#4ade80', '4C1': '#38bdf8', '4C2': '#c084fc', '4C3': '#fb923c', '4C': '#38bdf8', CP: '#f472b6' };
const MULTI_COLOR = '#ffffff', NONE_COLOR = '#94a3b8', SEL_COLOR = '#ffd400', IMP_COLOR = '#ff7a00';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Bản đồ ----------
const MAX_ZOOM = 21;   // phóng sâu hơn mức ảnh gốc: phóng to ảnh rõ nhất hiện có (để chỉnh đỉnh chính xác)
// Xoay bản đồ (leaflet-rotate): điện thoại xoay bằng 2 ngón; máy tính giữ Shift + lăn chuột, hoặc kéo nút la bàn
const map = L.map('map', { zoomControl: true, maxZoom: MAX_ZOOM, rotate: true, bearing: 0,
  touchRotate: true, shiftKeyRotate: true, rotateControl: false }).setView([11.9, 108.3], 9);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/';
const sat = L.tileLayer(ESRI + 'tile/{z}/{y}/{x}',
  { maxZoom: MAX_ZOOM, maxNativeZoom: 18, attribution: 'Ảnh vệ tinh © Esri' }).addTo(map);
const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: MAX_ZOOM, maxNativeZoom: 18 }).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: MAX_ZOOM, maxNativeZoom: 19, attribution: '© OpenStreetMap' });

// Esri không có ảnh độ phân giải cao ở mọi nơi (vùng Lâm Đồng thường chỉ tới mức 18): hỏi bản đồ phủ ảnh
// (tilemap) xem tại giữa màn hình có ảnh tới mức nào, rồi phóng to ảnh của mức đó thay vì hiện ô xám
// "Map data not yet available".
const satAvail = {};
function satHas(z, ll) {
  const n = 2 ** z, rad = ll.lat * Math.PI / 180;
  const x = Math.floor((ll.lng + 180) / 360 * n);
  const y = Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n);
  const key = z + '/' + y + '/' + x;
  if (!(key in satAvail)) {
    satAvail[key] = fetch(ESRI + 'tilemap/' + key + '/1/1').then(r => r.json())
      .then(j => !!(j && j.data && j.data[0])).catch(() => null);
  }
  return satAvail[key];
}
let satCheck = 0;
async function satFitNative() {
  if (!map.hasLayer(sat) || map.getZoom() < 17) return;
  const id = ++satCheck, ll = map.getCenter();
  let best = 17;
  for (const z of [20, 19, 18]) {
    const ok = await satHas(z, ll);
    if (id !== satCheck) return;              // người dùng đã di chuyển tiếp
    if (ok !== false) { best = z; break; }    // không hỏi được (mất mạng) thì cứ thử tải ảnh
  }
  if (sat.options.maxNativeZoom !== best) {
    sat.options.maxNativeZoom = best;
    map.removeLayer(sat); sat.addTo(map); sat.bringToBack();
  }
}
map.on('moveend', satFitNative);

// Nút la bàn: kim chỉ hướng Bắc; bấm để quay về hướng Bắc; kéo ngang để xoay (tiện trên máy tính)
const NorthCtl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control northctl');
    const a = L.DomUtil.create('a', '', div);
    a.href = '#'; a.setAttribute('role', 'button');
    a.title = 'Xoay bản đồ: kéo ngang nút này (hoặc Shift + lăn chuột, điện thoại: xoay 2 ngón). Bấm để quay về hướng Bắc.';
    a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2l5 10h-10z" fill="#e11d48"/><path d="M12 22l-5-10h10z" fill="#94a3b8"/></svg>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(a, 'click', e => L.DomEvent.preventDefault(e));
    let drag = null;
    a.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      drag = { x: e.clientX, b: map.getBearing(), moved: false };
      a.setPointerCapture(e.pointerId);
    });
    a.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 4) drag.moved = true;
      if (drag.moved) map.setBearing(drag.b + dx * 0.6);
    });
    a.addEventListener('pointerup', () => {
      if (drag && !drag.moved) map.setBearing(0);
      drag = null;
    });
    this._svg = a.firstChild;
    return div;
  }
});
const northCtl = new NorthCtl().addTo(map);

// Chụm 2 ngón để phóng to/thu nhỏ: chỉ xoay khi xoay 2 ngón rõ ràng (> 12°), tránh xoay nhẹ ngoài ý muốn
// (mỗi lần xoay phải vẽ lại toàn bộ lô nên làm polygon chạy chậm hơn ảnh nền)
(function () {
  const tg = map.touchGestures;
  if (!tg || !tg._onTouchMove) return;
  const move = tg._onTouchMove, end = tg._onTouchEnd, R2D = 180 / Math.PI;
  tg._onTouchMove = function (e) {
    if (this._rotating && e.touches && e.touches.length === 2 && !this._rotOn) {
      const m = this._map, v = m.mouseEventToContainerPoint(e.touches[0]).subtract(m.mouseEventToContainerPoint(e.touches[1]));
      const th = Math.atan(v.x / v.y);
      let d = (th - this._startTheta) * R2D;
      d = ((d + 90) % 180 + 180) % 180 - 90;
      if (Math.abs(d) < 12) {
        this._rotating = false;
        try { move.call(this, e); } finally { this._rotating = true; }
        return;
      }
      this._rotOn = true;                                    // bắt đầu xoay từ hướng hiện tại, không giật
      this._startTheta = th;
      this._startBearing = m.getBearing() + (v.y < 0 ? 180 : 0);
    }
    return move.call(this, e);
  };
  tg._onTouchEnd = function (e) { this._rotOn = false; return end.call(this, e); };
})();
function northStyle() {
  const b = map.getBearing() || 0;
  northCtl._svg.style.transform = 'rotate(' + b + 'deg)';
}
map.on('rotate', northStyle);
northStyle();
L.control.layers({ 'Vệ tinh': sat, 'Bản đồ đường': osm }, { 'Nhãn địa danh': labels }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);
// Lớp kiểm tra EUDR: rừng năm 2020 (EC JRC GFC2020) + mất rừng sau 31/12/2020 (UMD/Global Forest Watch)
const EUDR_LOSS_TO = 2024;
const eudrLayer = L.layerGroup([
  L.tileLayer.wms('https://ies-ows.jrc.ec.europa.eu/iforce/gfc2020/wms.py', {
    layers: 'gfc2020_v4', format: 'image/png', transparent: true, version: '1.3.0', opacity: 0.5, maxZoom: MAX_ZOOM,
    attribution: 'Rừng 2020 © EC JRC GFC2020' }),
  L.tileLayer('https://tiles.globalforestwatch.org/umd_tree_cover_loss/latest/dynamic/{z}/{x}/{y}.png?start_year=2021&end_year=' +
    EUDR_LOSS_TO + '&tree_cover_density_threshold=30&render_type=true_color', {
    tileSize: 512, zoomOffset: -1, maxNativeZoom: 15, maxZoom: MAX_ZOOM, opacity: 0.95,
    attribution: 'Mất rừng 2021–' + EUDR_LOSS_TO + ' © UMD / Global Forest Watch' })
]);
const EudrLegend = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const d = L.DomUtil.create('div', 'eudr-legend');
    d.innerHTML = '<b>Kiểm tra EUDR</b><div><i style="background:#4d9221"></i>Rừng năm 2020 (JRC)</div>' +
      '<div><i style="background:#e462a0"></i>Mất rừng 2021–' + EUDR_LOSS_TO + ' (GFW)</div>' +
      '<div class="muted">Lô nằm trên vùng hồng cần kiểm tra</div>';
    return d;
  }
});
const eudrLegend = new EudrLegend();
function setEudr(on) {
  if (on) { eudrLayer.addTo(map); eudrLegend.addTo(map); eudrLayer.eachLayer(l => l.bringToFront && l.bringToFront()); }
  else { map.removeLayer(eudrLayer); eudrLegend.remove(); }
}
const plotGroup = L.featureGroup().addTo(map);
const plotCanvas = L.canvas({ padding: 0.5, tolerance: 4 });   // vẽ hàng nghìn lô nhanh hơn SVG
// Khi xoay, plugin vẽ lại toàn bộ lô ở mỗi sự kiện: gộp lại tối đa 1 lần mỗi khung hình
(function () {
  const ge = plotCanvas.getEvents;
  plotCanvas.getEvents = function () {
    const ev = ge.call(this), self = this;
    if (ev.rotate) {
      let raf = 0;
      ev.rotate = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (self._map) self._update(); }); };
    }
    return ev;
  };
})();
// Bán kính điểm theo mức phóng: nhỏ khi nhìn xa để không che nhau
function ptRadius(z) { return z <= 10 ? 2 : z <= 12 ? 3 : z <= 14 ? 4 : z <= 16 ? 5 : 6; }
function ptStyle() { const r = ptRadius(map.getZoom()); return { radius: r, weight: r <= 3 ? 1 : 2 }; }
map.on('zoomend', () => {
  const st = ptStyle();
  Object.values(layerById).forEach(l => { if (l instanceof L.CircleMarker) { l.setRadius(st.radius); l.setStyle({ weight: st.weight }); } });
});
map.pm.setGlobalOptions({ allowSelfIntersection: false, snappable: true, snapDistance: 15 });

// ---------- Diện tích (giống Code.gs) ----------
function ringArea(c) {
  const R = 6378137, rad = d => d * Math.PI / 180, n = c.length;
  let a = 0;
  if (n > 2) {
    for (let i = 0; i < n; i++) {
      let lo, mi, up;
      if (i === n - 2) { lo = n - 2; mi = n - 1; up = 0; }
      else if (i === n - 1) { lo = n - 1; mi = 0; up = 1; }
      else { lo = i; mi = i + 1; up = i + 2; }
      a += (rad(c[up][0]) - rad(c[lo][0])) * Math.sin(rad(c[mi][1]));
    }
    a = a * R * R / 2;
  }
  return a;
}
function polyArea(rings) {
  if (!rings || !rings.length) return 0;
  let a = Math.abs(ringArea(rings[0]));
  for (let i = 1; i < rings.length; i++) a -= Math.abs(ringArea(rings[i]));
  return a;
}
function areaHa(g) {
  if (!g) return 0;
  const m2 = g.type === 'Polygon' ? polyArea(g.coordinates)
    : g.type === 'MultiPolygon' ? g.coordinates.reduce((s, p) => s + polyArea(p), 0) : 0;
  return m2 / 10000;
}
const fmtHa = x => x.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ha';

// ---------- Gọi Apps Script ----------
const API_URL = (window.APP_CONFIG || {}).API_URL || '';
const TOKEN_KEY = 'lv_token', EMAIL_KEY = 'lv_email';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
// Dữ liệu lớn được máy chủ nén gzip (nhỏ hơn ~7 lần), trình duyệt tự giải nén
const CAN_GZ = typeof DecompressionStream !== 'undefined';
async function gunzip64(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

// ---------- Lưu dữ liệu trên máy (IndexedDB) ----------
// Mở app: hiện ngay dữ liệu đã lưu trên máy, rồi lấy bản mới từ máy chủ ở nền.
// Mỗi tài khoản một bản riêng; đăng xuất hoặc hết phiên thì xóa hết.
const CACHE_VER = 1;
const cache = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const rq = indexedDB.open('lovuon', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }).catch(e => { this._db = null; throw e; });
    return this._db;
  },
  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', mode), rq = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(rq && rq.result);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  },
  key: () => 'data:' + (store.get(EMAIL_KEY) || ''),
  async get() {
    try {
      const rec = await this._tx('readonly', s => s.get(this.key()));
      return rec && rec.v === CACHE_VER && rec.data ? rec : null;
    } catch (e) { return null; }
  },
  async put(data, sig) {
    try { await this._tx('readwrite', s => s.put({ v: CACHE_VER, t: Date.now(), sig, data }, this.key())); } catch (e) {}
  },
  async clear() {
    try { await this._tx('readwrite', s => s.clear()); } catch (e) {}
  }
};
// Dấu vân tay nhanh của dữ liệu: giống nhau thì khỏi vẽ lại bản đồ
function hashStr(s) {
  let h1 = 0x811c9dc5, h2 = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619); h2 = (h2 * 31 + c) | 0;
  }
  return s.length + '-' + (h1 >>> 0).toString(36) + '-' + (h2 >>> 0).toString(36);
}
let dataSig = null;   // vân tay bản đang hiện; null = đã sửa tại máy, chưa khớp máy chủ
let cacheTimer = null;
// Lưu bản đang hiện (kể cả các thay đổi vừa lưu thành công) để lần mở sau thấy ngay
function saveCacheSoon() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    if (!DATA || savesPending) return;
    try { cache.put(JSON.parse(JSON.stringify(DATA)), dataSig); } catch (e) {}
  }, 1500);
}
const fmtTime = t => new Date(t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

async function api(action, payload) {
  if (!API_URL || /XXXX/.test(API_URL)) throw new Error('Chưa cấu hình địa chỉ cổng dữ liệu (config.js).');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: store.get(TOKEN_KEY), gz: CAN_GZ ? 1 : 0 }, payload)) });
  } catch (e) {
    throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
  }
  let j;
  try {
    j = await r.json();
    if (j.gz) j = { ok: true, data: JSON.parse(await gunzip64(j.gz)) };
  } catch (e) { throw new Error('Máy chủ trả về dữ liệu lạ (mã ' + r.status + ').'); }
  if (!j.ok) {
    if (j.auth) { store.set(TOKEN_KEY, null); cache.clear(); dataSig = null; showLogin(j.error); }
    const err = new Error(j.error || 'Lỗi không xác định');
    err.auth = !!j.auth;
    throw err;
  }
  return j.data;
}
function call(fn, ...args) { return api(fn, { args }); }

function showLogin(msg) {
  $('#login').hidden = false;
  $('#lgErr').textContent = msg || '';
  $('#lgEmail').value = store.get(EMAIL_KEY) || $('#lgEmail').value;
  setTimeout(() => ($('#lgEmail').value ? $('#lgPin') : $('#lgEmail')).focus(), 50);
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#lgEmail').value.trim(), pin = $('#lgPin').value.trim();
  $('#lgBtn').disabled = true; $('#lgErr').textContent = '';
  try {
    const d = await api('login', { email, pin });
    store.set(TOKEN_KEY, d.token); store.set(EMAIL_KEY, d.email);
    $('#lgPin').value = '';
    $('#login').hidden = true;
    firstLoad = true;
    dataSig = null;
    load(false);
  } catch (err) {
    $('#lgErr').textContent = err.message;
  } finally {
    $('#lgBtn').disabled = false;
  }
});
async function logout() {
  if (hasUnsaved() && !confirm('Bạn có thay đổi chưa lưu. Vẫn đăng xuất?')) return;
  try { await api('logout', {}); } catch (e) {}
  clearTimeout(cacheTimer);
  await cache.clear();
  store.set(TOKEN_KEY, null);
  location.reload();
}
function busy(on) { $('#busy').classList.toggle('on', on); }
let toastTimer = null;
function toast(msg, ms = 3500) {
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// ---------- Hộ, chương trình, lọc ----------
const farms = () => DATA.ho.rows;
const farmOf = p => farms()[String(p.props[C.farm] ?? '').trim()];
const progsOf = p => { const f = farmOf(p); return f ? C.programs.filter(k => f.props[k] === true) : []; };
// Nguồn diện tích khai báo: lô RA lấy theo GMR, lô chỉ có 4C lấy theo BPM
const srcLabel = p => { const pr = progsOf(p); return pr.includes('RA') ? 'GMR' : pr.some(k => /^4C/.test(k)) ? 'BPM' : 'khai báo'; };
function colorOf(p) {
  const pr = progsOf(p);
  // Mọi hộ đều RA nên tô màu theo nhóm 4C nếu có; chỉ RA -> xanh lá
  const extra = pr.filter(k => k !== 'RA');
  const show = extra.length ? extra : pr;
  return !show.length ? NONE_COLOR : show.length > 1 ? MULTI_COLOR : PROG_COLOR[show[0]] || NONE_COLOR;
}
function visible(p) {
  const pr = progsOf(p);
  return pr.length ? pr.some(k => filter[k]) : filter.none;
}
function tagsHtml(p) {
  return progsOf(p).map(k => `<span class="tag" style="background:${PROG_COLOR[k] || NONE_COLOR}">${esc(k)}</span>`).join('');
}
// Chỉ tên chủ hộ, không kèm địa chỉ. Một số tên nhập từ BPM có dính địa chỉ không dấu ở cuối
// (vd "Nguyễn Văn Ý Xuan Truong Da Lat") → bỏ các từ cuối trùng với xã/thôn/tỉnh của hộ.
const ADDR_RE = /thon|xa|huyen|tinh|diachi|dia_chi|ap|phuong|quan/i;
const foldVN = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
function farmName(f) {
  if (!f) return '';
  const cols = C.listCols || [];
  // Họ đệm + tên (mọi cột trong listCols trừ cột địa chỉ)
  const nameKeys = cols.filter(k => !ADDR_RE.test(k));
  let name = nameKeys.map(k => String(f.props[k] ?? '').trim()).filter(Boolean).join(' ');
  if (!name) return '';
  const addr = new Set(Object.keys(f.props).filter(k => !nameKeys.includes(k) && ADDR_RE.test(k))
    .flatMap(k => foldVN(f.props[k] ?? '').split(/[^a-z0-9]+/)).filter(Boolean));
  ['xuan truong', 'da lat', 'lam dong', 'son la'].forEach(x => x.split(' ').forEach(w => addr.add(w)));
  const words = name.split(/\s+/);
  let cut = words.length;              // chỉ bỏ khi cuối tên có ≥2 từ không dấu liên tiếp là địa danh (vd "Da Lat")
  while (cut > 2 && /^[A-Za-z0-9.,-]+$/.test(words[cut - 1]) && addr.has(foldVN(words[cut - 1]).replace(/[^a-z0-9]/g, ''))) cut--;
  return (words.length - cut >= 2 ? words.slice(0, cut) : words).join(' ').replace(/[\s,;\-–]+$/, '');
}

const LAYER_KEY = 'lv_layers';
function saveFilter() { try { localStorage.setItem(LAYER_KEY, JSON.stringify(filter)); } catch (e) {} }
function renderChips() {
  if (!Object.keys(filter).length) {
    C.programs.forEach(k => { filter[k] = true; }); filter.none = true; filter.eudr = false;
    try { Object.assign(filter, JSON.parse(localStorage.getItem(LAYER_KEY) || '{}')); } catch (e) {}
    filter.eudr = false;   // bản đồ EUDR nặng: chỉ tải khi người dùng bật
  }
  const counts = { none: 0 };
  DATA.lo.rows.forEach(p => {
    const pr = progsOf(p);
    if (!pr.length) counts.none++;
    pr.forEach(k => { counts[k] = (counts[k] || 0) + 1; });
  });
  const items = [['eudr', 'EUDR', 'linear-gradient(135deg,#4d9221 50%,#e462a0 50%)', '']]
    .concat(C.programs.map(k => [k, k, PROG_COLOR[k] || NONE_COLOR, counts[k] || 0]));
  if (counts.none) items.push(['none', 'Chưa tham gia', NONE_COLOR, counts.none]);
  $('#chips').innerHTML = `<span class="chips-t">Hiện/ẩn bản đồ:</span>` + items.map(([k, label, color, n]) =>
    `<span class="chip ${filter[k] ? 'on' : 'off'}" data-f="${esc(k)}" role="switch" aria-checked="${!!filter[k]}">` +
    `<span class="tick">${filter[k] ? '✓' : ''}</span><span class="dot" style="background:${color}"></span>${esc(label)}` +
    (n !== '' ? ` <span class="muted">${n}</span>` : '') + `</span>`).join('');
  $('#chips').querySelectorAll('[data-f]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.f;
    filter[k] = !filter[k];
    saveFilter();
    if (k === 'eudr') { setEudr(filter.eudr); renderChips(); return; }
    renderChips(); renderLayers();
    if (!sel) showList();
  }));
}

// ---------- Tải dữ liệu ----------
// Đưa một bộ dữ liệu (từ máy chủ hoặc từ bộ nhớ máy) lên bản đồ
function applyData(d, keepView) {
  DATA = d;
  if (d.ver) dataVer = d.ver;
  C = DATA.cfg;
  // Đổi nhãn hiển thị trên bản đồ (không đổi tên cột trong Sheet)
  Object.values(C.fields || {}).forEach(list => Array.isArray(list) && list.forEach(m => {
    if (m && typeof m.label === 'string') m.label = m.label.replace(/Sản lượng ước\s+năm nay/i, 'Sản lượng ước tính năm nay');
  }));
  DATA.photos = DATA.photos || {};
  Object.keys(PHOTOS).forEach(id => { if ((DATA.photos[id] || 0) !== PHOTOS[id].length) delete PHOTOS[id]; });
  byId = {};
  DATA.lo.rows.forEach(p => { byId[p.id] = p; });
  $('#btnExport').hidden = !DATA.user.isAdmin;
  if (GPS.fix) { GPS.inPlot = plotAt(GPS.fix.coords.latitude, GPS.fix.coords.longitude); gpsUpdateBadge(); }
  renderChips();
  renderLayers();
  if (firstLoad) {
    firstLoad = false;
    if (FOCUS_ID && byId[FOCUS_ID]) { sel = FOCUS_ID; renderLayers(); showPlot(sel, true); return; }
    fitAll();
  } else if (!keepView) fitAll();
  if (sel && byId[sel]) showPlot(sel, false); else { sel = null; showList(); }
}

// Lấy dữ liệu mới từ máy chủ. Trùng bản đang hiện thì không vẽ lại.
// background: đang hiện bản lưu trên máy, nếu người dùng đang sửa thì chưa thay (lần tự làm mới sau sẽ thay).
let cacheShownAt = 0;
async function load(keepView, background) {
  busy(true);
  try {
    const d = await call('getData');
    const sig = hashStr(JSON.stringify(d));
    if (DATA && sig === dataSig) { cacheShownAt = 0; if (d.ver) { dataVer = d.ver; DATA.ver = d.ver; } return; }
    if (background && (hasUnsaved() || savesPending || !$('#modal').hidden)) return;
    cache.put(d, sig);          // lưu bản gốc từ máy chủ trước khi áp dụng
    dataSig = sig;
    cacheShownAt = 0;
    applyData(d, keepView);
  } catch (e) {
    if (e.auth) return;
    if (DATA) toast((cacheShownAt ? 'Đang xem dữ liệu lưu trên máy lúc ' + fmtTime(cacheShownAt) + '. ' : '') + (e.message || e), 7000);
    else $('#panelBody').innerHTML = '<p class="err">' + esc(e.message || e) + '</p>';
  } finally {
    busy(false);
  }
}

// Mở app: hiện ngay bản lưu trên máy (nếu có), đồng thời lấy bản mới ở nền
async function boot() {
  if (!store.get(TOKEN_KEY)) { showLogin(); return; }
  const rec = await cache.get();
  if (rec && !DATA) {
    try {
      dataSig = rec.sig || null;
      cacheShownAt = rec.t;
      applyData(rec.data, false);
    } catch (e) { DATA = null; dataSig = null; cacheShownAt = 0; }
  }
  load(!!DATA, !!DATA);
}

function pointOf(p) {
  const lat = Number(p.props[C.lat]), lng = Number(p.props[C.lon]);
  if (!p.props[C.lat] || !p.props[C.lon] || !isFinite(lat) || !isFinite(lng)) return null;
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? [lat, lng] : null;
}

function styleFor(p) {
  if (p.id === sel) return { color: SEL_COLOR, weight: 3, fillColor: SEL_COLOR, fillOpacity: 0.2 };
  const c = colorOf(p);
  return { color: c, weight: 2, fillColor: c, fillOpacity: 0.1 };
}

function renderLayers() {
  plotGroup.clearLayers();
  layerById = {};
  DATA.lo.rows.forEach(p => {
    if (!visible(p) && p.id !== sel) return;
    const layer = makeLayer(p);
    if (!layer) return;
    plotGroup.addLayer(layer);
    layerById[p.id] = layer;
  });
  renderLabels();
}
let lastLayerClick = 0;
function makeLayer(p) {
  let layer = null;
  if (p.geometry) {
    try { layer = L.geoJSON(p.geometry, { style: styleFor(p), renderer: plotCanvas }).getLayers()[0]; } catch (e) { layer = null; }
  } else {
    const ll = pointOf(p);
    if (ll) layer = L.circleMarker(ll, Object.assign({ color: '#fff', fillColor: colorOf(p), fillOpacity: 1, renderer: plotCanvas }, ptStyle()));
  }
  if (!layer) return null;
  layer.on('click', e => {
    L.DomEvent.stopPropagation(e);                 // không để lan ra bản đồ (bấm khoảng trống = bỏ chọn)
    lastLayerClick = Date.now();
    if (PT) { setPointPos(e.latlng); return; }        // đang sửa Point: chạm đâu đặt điểm ở đó
    if (!NEW && !map.pm.globalDrawModeEnabled()) select(p.id);
  });
  const f = farmOf(p);
  layer.bindTooltip(esc(p.id) + (f ? '<br>' + esc(farmName(f)) : ''), { sticky: true });
  return layer;
}
/** Vẽ lại riêng một lô (nhanh hơn vẽ lại cả 2.900 lô). */
function refreshLayer(id) {
  const old = layerById[id];
  if (old) { plotGroup.removeLayer(old); delete layerById[id]; }
  const p = byId[id];
  if (!p || (!visible(p) && id !== sel)) return;
  const l = makeLayer(p);
  if (l) { plotGroup.addLayer(l); layerById[id] = l; if (id === sel && l.bringToFront) l.bringToFront(); }
}

// Tên chủ hộ trên bản đồ khi phóng gần (zoom >= LABEL_ZOOM)
const LABEL_ZOOM = 16, LABEL_MAX = 250;
const labelGroup = L.layerGroup().addTo(map);
function renderLabels() {
  labelGroup.clearLayers();
  if (!DATA || map.getZoom() < LABEL_ZOOM) return;
  const b = map.getBounds().pad(0.1);
  let n = 0;
  for (const [id, l] of Object.entries(layerById)) {
    const ll = l.getBounds ? l.getBounds().getCenter() : l.getLatLng();
    if (!b.contains(ll)) continue;
    const p = byId[id], f = p && farmOf(p);
    const name = f ? [f.props.HoDem, f.props.Ten].filter(Boolean).join(' ') : id;
    if (!name) continue;
    const text = map.getZoom() >= 18 ? name + ' · ' + id : name;
    labelGroup.addLayer(L.marker(ll, { interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'plabel', html: '<span>' + esc(text) + '</span>', iconSize: [0, 0] }) }));
    if (++n >= LABEL_MAX) break;
  }
}
map.on('moveend zoomend', renderLabels);

function restyle() {
  Object.entries(layerById).forEach(([id, l]) => {
    if (l.setStyle && !(l instanceof L.CircleMarker) && byId[id]) l.setStyle(styleFor(byId[id]));
  });
}

// ---------- Điện thoại: khung kéo từ đáy ----------
const mobileMQ = window.matchMedia('(max-width: 760px)');
const isMobile = () => mobileMQ.matches;
function sheetPx() {
  return isMobile() ? $('#panel').getBoundingClientRect().height : 0;
}
/** Vùng bản đồ không bị thanh tìm kiếm / khung thông tin che */
function fitOpts(maxZoom, pad) {
  pad = pad || 30;
  return isMobile()
    ? { paddingTopLeft: [pad, 64 + pad], paddingBottomRight: [pad, sheetPx() + pad], maxZoom }
    : { padding: [pad, pad], maxZoom };
}
function panToVisible(ll, zoom) {
  if (zoom != null) map.setView(ll, zoom, { animate: false });
  if (!isMobile()) { map.panTo(ll); return; }
  const size = map.getSize(), top = 64, bottom = size.y - sheetPx();
  const target = L.point(size.x / 2, (top + bottom) / 2);
  const cur = map.latLngToContainerPoint(ll);
  map.panBy(cur.subtract(target), { animate: true });
}
function setSheet(state) {
  if (!isMobile()) return;
  $('#panel').dataset.state = state;
  if (state === 'peek') $('#panel').scrollTop = 0;
}
(function initSheet() {
  const grab = $('#grab'), order = ['peek', 'half', 'full'];
  let y0 = null;
  const step = d => {
    const i = order.indexOf($('#panel').dataset.state || 'half');
    setSheet(order[Math.max(0, Math.min(order.length - 1, i + d))]);
  };
  grab.addEventListener('click', () => {
    const st = $('#panel').dataset.state;
    setSheet(st === 'peek' ? 'half' : st === 'half' ? 'full' : 'peek');
  });
  // Kéo khung thông tin theo ngón tay rồi bám vào nấc gần nhất (thu gọn / nửa / toàn màn hình), tính cả đà vuốt.
  // Kéo ở thanh nắm, hoặc ở nội dung khi: vuốt lên lúc chưa toàn màn hình, vuốt xuống lúc nội dung đang ở đầu.
  const panel = $('#panel');
  const heights = () => {
    const vh = window.innerHeight;
    return { peek: 96, half: Math.round(vh * 0.52), full: vh - 64 };
  };
  let g = null;   // { y0, h0, mode: null | 'sheet' | 'scroll', fromGrab, last: [[t, y]...] }
  panel.addEventListener('touchstart', e => {
    if (!isMobile() || e.touches.length !== 1) { g = null; return; }
    if (e.target.closest('input, select, textarea, .ph-strip, .photos-row')) { g = null; return; }
    const y = e.touches[0].clientY;
    g = { y0: y, h0: panel.getBoundingClientRect().height, mode: null, fromGrab: !!e.target.closest('#grab'),
      last: [[e.timeStamp, y]] };
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (!g) return;
    const y = e.touches[0].clientY, dy = y - g.y0;
    if (!g.mode) {
      if (Math.abs(dy) < 6) return;
      const st = panel.dataset.state;
      g.mode = g.fromGrab || st === 'peek' || (dy < 0 && st !== 'full') || (dy > 0 && panel.scrollTop <= 0)
        ? 'sheet' : 'scroll';
      if (g.mode === 'sheet') { panel.classList.add('dragging'); g.y0 = y; g.h0 = panel.getBoundingClientRect().height; }
    }
    if (g.mode !== 'sheet') return;
    e.preventDefault();
    const H = heights();
    let h = g.h0 - (y - g.y0);
    if (h > H.full) h = H.full + (h - H.full) * 0.2;          // kéo quá: chậm lại cho cảm giác "đàn hồi"
    if (h < H.peek) h = H.peek - (H.peek - h) * 0.2;
    panel.style.height = Math.round(h) + 'px';
    g.last.push([e.timeStamp, y]); if (g.last.length > 5) g.last.shift();
  }, { passive: false });
  const endDrag = e => {
    if (!g) return;
    const was = g; g = null;
    if (was.mode !== 'sheet') return;
    const H = heights(), h = panel.getBoundingClientRect().height;
    const a = was.last[0], b = was.last[was.last.length - 1];
    const v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;    // px/ms, dương = vuốt xuống
    const order = ['peek', 'half', 'full'];
    const nearest = order.reduce((best, k) => Math.abs(H[k] - h) < Math.abs(H[best] - h) ? k : best, 'half');
    let target = nearest;
    if (v < -0.5) target = order.find(k => H[k] > h + 10) || 'full';                 // vuốt nhanh lên: nấc cao hơn
    else if (v > 0.5) target = order.slice().reverse().find(k => H[k] < h - 10) || 'peek';   // vuốt nhanh xuống
    panel.classList.remove('dragging');
    void panel.offsetHeight;                // bắt đầu chuyển động từ vị trí đang kéo
    panel.style.height = '';
    setSheet(target);
  };
  panel.addEventListener('touchend', endDrag);
  panel.addEventListener('touchcancel', endDrag);
  $('#btnMenu').addEventListener('click', () => $('#bar').classList.toggle('open'));
  map.on('click', () => { $('#bar').classList.remove('open'); });
})();

function fitAll() {
  if (plotGroup.getLayers().length) map.fitBounds(plotGroup.getBounds(), fitOpts(17, 20));
}

function zoomTo(id) {
  const l = layerById[id];
  if (!l) return;
  if (l.getBounds) map.fitBounds(l.getBounds(), fitOpts(18));
  else panToVisible(l.getLatLng(), Math.max(map.getZoom(), 17));
}

// ---------- Danh sách ----------
/** Bỏ dấu tiếng Việt, chữ thường: "Trương Thị Hồng" -> "truong thi hong" */
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
/** Chỉ tìm theo tên chủ hộ và mã vườn (mã lô) */
function matches(p, q) {
  if (!q) return true;
  const f = farmOf(p);
  const name = f ? fold([f.props.HoDem, f.props.Ten].filter(Boolean).join(' ')) : '';
  return fold(p.id).includes(q) || name.includes(q);
}

// ---------- Tìm theo tọa độ ngay trong ô tìm kiếm ----------
/** Ô tìm kiếm là tọa độ? (cần số thập phân hoặc ký hiệu độ để không nhầm với mã vườn) */
function coordQuery(v) {
  v = String(v || '').trim();
  if (!/\d[.,]\d|[°º]/.test(v)) return null;
  try { return parseCoords(v); } catch (e) { return null; }
}
/** Lô chứa điểm (polygon), hoặc lô gần nhất (kể cả lô dạng điểm) */
function plotsNear(ll) {
  let inside = null, near = null, nd = Infinity;
  DATA.lo.rows.forEach(p => {
    if (p.geometry) {
      try { if (!inside && inGeom(ll.lng, ll.lat, p.geometry)) inside = p; } catch (e) {}
    }
    const l = layerById[p.id];
    const c = l ? (l.getBounds ? l.getBounds().getCenter() : l.getLatLng()) : (pointOf(p) ? L.latLng(pointOf(p)) : null);
    if (!c) return;
    const d = map.distance(ll, c);
    if (d < nd) { nd = d; near = p; }
  });
  return { inside, near, nd };
}
let qPin = null;
function goCoord(ll) {
  if (qPin) map.removeLayer(qPin);
  qPin = L.marker(ll, { zIndexOffset: 900, icon: L.divIcon({ className: 'qpin', html: '<span></span>', iconSize: [18, 18], iconAnchor: [9, 9] }) })
    .addTo(map).bindTooltip(`${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}<br><small>Bấm để bỏ ghim</small>`, { direction: 'top', offset: [0, -10] });
  qPin.on('click', () => { map.removeLayer(qPin); qPin = null; });
  panToVisible(ll, Math.max(map.getZoom(), 17));
}
function coordItemHtml(ll) {
  const r = plotsNear(ll);
  let h = `<div class="item coord" id="qGo"><b>📍 Đến tọa độ ${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}</b>
    <span class="muted">Bấm (hoặc Enter) để đặt ghim đỏ trên bản đồ</span></div>`;
  if (r.inside) h += `<div class="item" data-id="${esc(r.inside.id)}"><b>Nằm trong lô ${esc(r.inside.id)}</b>${tagsHtml(r.inside)}<span class="muted">${esc(farmName(farmOf(r.inside)))}</span></div>`;
  else if (r.near) h += `<div class="item" data-id="${esc(r.near.id)}"><b>Lô gần nhất: ${esc(r.near.id)}</b> <span class="muted">~${r.nd < 1000 ? Math.round(r.nd) + ' m' : (r.nd / 1000).toFixed(1) + ' km'}</span>${tagsHtml(r.near)}<span class="muted">${esc(farmName(farmOf(r.near)))}</span></div>`;
  return h;
}

function showList() {
  const qll = coordQuery($('#q').value);
  const q = qll ? '' : fold($('#q').value);
  const all = DATA.lo.rows;
  const items = qll ? [] : all.filter(p => visible(p) && matches(p, q));
  const noGeom = all.filter(p => !p.geometry).length;
  let h = `<div class="stats"><b>${Object.keys(farms()).length}</b> hộ · <b>${all.length}</b> lô · <b>${noGeom}</b> lô chưa có ranh giới<br>
    <span class="muted">${esc(DATA.user.email || '')} ${DATA.user.role ? '· ' + esc(DATA.user.role) : ''}
    ${DATA.user.canEdit ? '' : '· chỉ xem'} · <button class="logout" id="btnLogout" type="button">Đăng xuất</button></span></div>`;
  if (qll) h += coordItemHtml(qll);
  else if (!items.length) h += '<p class="muted">Không có lô nào khớp.</p>';
  items.slice(0, 300).forEach(p => {
    const badge = p.props.__geomError ? '<span class="badge err">polygon lỗi</span>'
      : !p.geometry ? '<span class="badge warn">chưa có ranh giới</span>' : '';
    h += `<div class="item" data-id="${esc(p.id)}"><b>${esc(p.id)}${badge}</b>
      ${tagsHtml(p)}<span class="muted">${esc(farmName(farmOf(p)))}</span></div>`;
  });
  if (items.length > 300) h += `<p class="muted">Đang hiện 300/${items.length} lô. Gõ thêm để lọc.</p>`;
  $('#panelBody').innerHTML = h;
  $('#panelBody').querySelectorAll('.item[data-id]').forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
  if ($('#btnLogout')) $('#btnLogout').onclick = logout;
  if (qll) $('#qGo').onclick = () => { goCoord(qll); if (isMobile()) setSheet('peek'); };
}

// ---------- Chi tiết lô + hộ ----------
function hasUnsaved() {
  return Object.keys(dirtyLo).length > 0 || Object.keys(dirtyHo).length > 0 || !!geomEdit || !!PT || geomRemoved || !!NEW;
}

function confirmDiscard() {
  if (!hasUnsaved()) return true;
  if (!confirm('Bạn có thay đổi chưa lưu. Bỏ qua các thay đổi này?')) return false;
  cancelEdit(true);
  return true;
}

function select(id) {
  if (id === sel) { zoomTo(id); return; }
  if (!confirmDiscard()) return;
  const prev = sel;
  sel = id;
  if (prev && byId[prev] && !visible(byId[prev])) renderLayers(); else if (!layerById[id]) renderLayers(); else restyle();
  $('#bar').classList.remove('open');
  if (isMobile() && $('#panel').dataset.state === 'peek') setSheet('half');
  $('#panel').scrollTop = 0;
  showPlot(id, true);
}

let fidSeq = 0;
const SKIP_COLS = () => new Set(C.programs.concat([C.updated, C.updatedBy, C.action || 'ThaoTacCuoi', 'Polygon']));
let showMore = false;

function metaOf(kind, col) {
  return ((C.fields && C.fields[kind]) || []).find(m => m.col === col) || { col, label: col };
}
/** Bố cục: { main: [{kind, m}], more: [{group, items:[{kind, m}]}] } theo FIELDS.layout + cột lạ */
function layout() {
  const L0 = (C.fields && C.fields.layout) || { main: [], more: [], hidden: [] };
  const used = new Set([].concat(L0.main, L0.hidden || [], ...L0.more.map(g => g.items)));
  const conv = key => {
    const [kind, col] = key.split(':');
    if (kind === 'calc') return { kind, m: { calc: col, label: col === 'nLo' ? 'Số lô của hộ' : 'Số cây trồng chứng nhận' } };
    const headers = kind === 'ho' ? DATA.ho.headers : DATA.lo.headers;
    return headers.includes(col) ? { kind, m: metaOf(kind, col) } : null;
  };
  const main = L0.main.map(conv).filter(Boolean);
  const more = L0.more.map(g => ({ group: g.group, items: g.items.map(conv).filter(Boolean) })).filter(g => g.items.length);
  const extra = [];
  [['lo', DATA.lo.headers], ['ho', DATA.ho.headers]].forEach(([kind, hs]) => hs.forEach(col => {
    if (col && !used.has(kind + ':' + col) && !SKIP_COLS().has(col)) extra.push({ kind, m: metaOf(kind, col) });
  }));
  return { main, more };
}

function suggestValues(kind, m) {
  if (m.suggest === 'farm') return Object.keys(farms());
  const rows = kind === 'ho' ? Object.values(farms()) : DATA.lo.rows;
  const set = new Set();
  rows.forEach(r => { const v = r.props[m.col]; if (v !== '' && v != null) set.add(String(v)); });
  return Array.from(set).sort((x, y) => x.localeCompare(y, 'vi'));
}

function curVal(kind, obj, col) {
  const d = kind === 'ho' ? dirtyHo : dirtyLo;
  return Object.prototype.hasOwnProperty.call(d, col) ? d[col] : (obj ? obj.props[col] : '');
}

function numOf(v) {
  if (v === '' || v == null) return null;
  const n = Number(String(v).replace(',', '.'));
  return isFinite(n) ? n : NaN;
}

/** Kiểm tra giá trị một ô, trả về câu báo lỗi hoặc ''. */
function fieldError(m, v) {
  const empty = v === '' || v == null;
  if (empty) return m.req ? 'Bắt buộc trong GMR' : '';
  if (m.type === 'number' || m.type === 'int') {
    const n = numOf(v);
    if (isNaN(n)) return 'Phải là số';
    if (m.type === 'int' && !Number.isInteger(n)) return 'Phải là số nguyên';
    if (m.min != null && n < m.min) return 'Không nhỏ hơn ' + m.min;
    if (m.max != null && n > m.max) return 'Không lớn hơn ' + m.max;
  }
  if (m.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return 'Ngày không hợp lệ';
  if (m.pattern && !new RegExp(m.pattern).test(String(v).trim())) return m.patternMsg || 'Sai định dạng';
  return '';
}

function fieldHtml(kind, m, obj, ro, ctx) {
  if (m.calc) {
    return `<div class="field"><label>${esc(m.label)}</label><div class="calc">${esc(ctx[m.calc])}</div></div>`;
  }
  const fid = 'f' + (++fidSeq);
  let v = obj ? obj.props[m.col] : '';
  if (v == null) v = '';
  if (m.col === 'DienTichDo_ha' && v !== '' && isFinite(Number(v))) v = (Math.round(Number(v) * 100) / 100).toFixed(2);
  const lockRo = ro || m.ro || m.auto;
  const attrs = `id="${fid}" data-kind="${kind}" data-k="${esc(m.col)}" ${lockRo ? (m.type === 'select' ? 'disabled' : 'readonly') : ''}`;
  let input;
  if (typeof v === 'boolean') {
    return `<div class="field check"><input type="checkbox" ${attrs} ${v ? 'checked' : ''} ${lockRo ? 'disabled' : ''}>
      <label for="${fid}">${esc(m.label)}</label></div>`;
  } else if (m.type === 'select') {
    const opts = m.options.slice();
    if (v !== '' && !opts.includes(String(v))) opts.push(String(v));
    input = `<select ${attrs}>` + opts.map(o => `<option value="${esc(o)}" ${String(v) === o ? 'selected' : ''}>${esc(o || '—')}</option>`).join('') + '</select>';
  } else if (m.type === 'date') {
    input = `<input type="date" ${attrs} value="${esc(String(v).slice(0, 10))}">`;
  } else {
    const mode = m.type === 'number' ? 'inputmode="decimal"' : m.type === 'int' || m.type === 'tel' ? 'inputmode="numeric"' : '';
    let list = '';
    if (m.suggest && !lockRo) {
      list = `list="dl${fid}"`;
      input = `<datalist id="dl${fid}">` + suggestValues(kind, m).map(o => `<option value="${esc(o)}">`).join('') + '</datalist>';
    }
    input = (input || '') + `<input type="text" ${attrs} ${mode} ${list} value="${esc(v)}">`;
  }
  const err = lockRo ? '' : fieldError(m, v);
  return `<div class="field ${err ? 'bad' : ''}" data-field="${esc(kind + ':' + m.col)}">
    <label for="${fid}">${esc(m.label)}${m.req ? ' <span class="req">*</span>' : ''}</label>${input}
    ${m.hint ? `<div class="fhint">${esc(m.hint)}</div>` : ''}<div class="ferr">${esc(err)}</div></div>`;
}

const BPM_KEYS_DEFAULT = ['ho:HoDem', 'ho:Ten', 'ho:GioiTinh', 'ho:CCCD', 'lo:MaLo4C', 'ho:ThonXa', 'ho:Tinh', 'lo:ViDo', 'lo:KinhDo',
  'ho:LaoDongThuongXuyen', 'ho:LaoDongThoiVu', 'ho:SanLuongUoc_kg', 'lo:DienTich_ha', 'ho:Giong', 'ho:DaiLy'];

/** Lần tạo/sửa gần nhất của lô (hoặc của hộ, nếu sửa hộ mới hơn): tên người, giờ, thao tác. */
function lastEditHtml(p, f) {
  const A = C.action || 'ThaoTacCuoi';
  const cand = [[p, 'lô'], [f, 'hộ']].filter(([o]) => o && o.props[C.updated])
    .map(([o, k]) => ({ t: String(o.props[C.updated]), by: o.props[C.updatedBy], act: o.props[A], k }))
    .sort((a, b) => b.t.localeCompare(a.t));
  const e = cand[0];
  const when = t => { const m = t.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/); return m ? (m[4] ? m[4] + ':' + m[5] : '00:00') + ' ' + m[3] + '/' + m[2] + '/' + m[1] : t; };
  return `<div class="lastedit"><span class="muted">Cập nhật gần nhất:</span> ` + (e
    ? `<b>${esc(e.by || '(không rõ)')}</b> · ${esc(when(e.t))} · <span class="muted">${esc(e.act || 'Sửa thông tin ' + e.k)}</span>`
    : `<span class="muted">chưa có</span>`) + `</div>`;
}

function fieldsHtml(p, f, ro, ctx) {
  const L1 = layout();
  const one = ({ kind, m }) => {
    const obj = kind === 'lo' ? p : kind === 'ho' ? f : null;
    if (kind === 'ho' && !f) return '';
    const sysRo = m.col && (kind === 'ho' ? C.readonlyHo : C.readonlyLo).includes(m.col) && m.col !== C.farm;
    return fieldHtml(kind, m, obj, ro || sysRo, ctx);
  };
  // Hộ chỉ có 4C (không RA): "Hiển thị thêm" chỉ giữ các ô có trong file BPM
  const pr = progsOf(p), only4C = pr.length > 0 && !pr.includes('RA');
  let more = L1.more;
  if (only4C) {
    const keep = new Set((C.fields && C.fields.layout && C.fields.layout.bpm) || BPM_KEYS_DEFAULT);
    more = more.map(g => ({ group: g.group, items: g.items.filter(it => keep.has(it.kind + ':' + it.m.col)) }))
      .filter(g => g.items.length);
  }
  let h = `<div class="mainf">` + L1.main.map(one).join('') + `</div>`;
  h += `<button class="more-btn" id="btnMore" type="button">${showMore ? '▲ Ẩn bớt' : '▼ Hiển thị thêm'}</button>`;
  h += `<div id="moreBox" ${showMore ? '' : 'hidden'}>`;
  if (only4C) h += `<p class="muted">Hộ chỉ tham gia ${esc(pr.join(', '))}: chỉ hiện các thông tin có trong file BPM.</p>`;
  more.forEach(g => {
    h += `<div class="grp"><div class="grp-t">${esc(g.group)}</div>` + g.items.map(one).join('') + `</div>`;
  });
  return h + `</div>`;
}

function pipRing(x, y, r) {
  let ins = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}

function cccdInfo(c) {
  const s = String(c || '').trim();
  if (!/^\d{12}$/.test(s)) return null;
  const d = Number(s[3]), year = 1900 + Math.floor(d / 2) * 100 + Number(s.slice(4, 6));
  const age = new Date().getFullYear() - year;
  return age < 15 || age > 100 ? null : { gender: d % 2 === 0 ? 'Male' : 'Female', year };
}

/** Kiểm tra giống sheet Dashboard của GMR + kiểm tra polygon. */
function runChecks(p, f) {
  const out = [];
  const fmt = n => (Math.round(n * 1000) / 1000).toLocaleString('vi-VN');
  const missing = [];
  const L1 = layout();
  // Hộ chỉ tham gia 4C: chỉ kiểm tra các ô có trong file BPM (không đòi các ô riêng của GMR)
  const prs = progsOf(p), only4C = prs.length > 0 && !prs.includes('RA');
  const bpmKeys = new Set((C.fields && C.fields.layout && C.fields.layout.bpm) || BPM_KEYS_DEFAULT);
  [].concat(L1.main, ...L1.more.map(g => g.items)).forEach(({ kind, m }) => {
    const obj = kind === 'lo' ? p : kind === 'ho' ? f : null;
    if (!obj || !m.col || m.ro || m.auto) return;
    if (only4C && !bpmKeys.has(kind + ':' + m.col)) return;
    const e = fieldError(m, curVal(kind, obj, m.col));
    if (e) missing.push(m.label + ': ' + e.toLowerCase());
  });
  if (f) {
    const cc = String(curVal('ho', f, 'CCCD') || '').trim();
    if (/^\d{12}$/.test(cc) && !cccdInfo(cc)) out.push(['warn', 'CCCD có vẻ bị sai: không suy ra được năm sinh hợp lệ (số thứ 4–6 của CCCD)']);
  }
  if (missing.length) out.push(['err', 'Cần sửa: ' + missing.join('; ')]);
  if (f) {
    const plots = DATA.lo.rows.filter(x => String(x.props[C.farm]).trim() === f.id);
    const sum = plots.reduce((s, x) => s + (numOf(x.id === p.id ? curVal('lo', p, 'DienTich_ha') : x.props.DienTich_ha) || 0), 0);
    const tot = numOf(curVal('ho', f, 'TongDienTich_ha'));
    if (tot != null && !isNaN(tot) && Math.abs(tot - sum) > 0.005) {
      out.push(['warn', `Diện tích tổng của hộ = ${fmt(tot)} ha, nhưng cộng ${plots.length} lô = ${fmt(sum)} ha`]);
    }
    const cert = numOf(curVal('ho', f, 'DienTichChungNhan_ha'));
    if (cert != null && tot != null && cert > tot + 0.005) out.push(['warn', `Diện tích cà phê (${fmt(cert)} ha) lớn hơn diện tích tổng (${fmt(tot)} ha)`]);
    const prev = numOf(curVal('ho', f, 'SanLuongNamTruoc_kg')), sold = numOf(curVal('ho', f, 'SanLuongBanNamTruoc_kg'));
    if (prev != null && sold != null && sold > prev) out.push(['warn', `Sản lượng bán năm trước (${fmt(sold)} kg) lớn hơn sản lượng năm trước (${fmt(prev)} kg)`]);
    const est = numOf(curVal('ho', f, 'SanLuongUoc_kg'));
  }
  const decl = numOf(curVal('lo', p, 'DienTich_ha'));
  const g = geomEdit && geomEdit.layer ? currentGeom() : (geomRemoved ? null : p.geometry);
  if (g && decl) {
    const meas = areaHa(g), dv = (meas - decl) / decl * 100;
    if (Math.abs(dv) > 20) out.push(['warn', `Diện tích đo từ polygon ${fmt(meas)} ha lệch ${dv > 0 ? '+' : ''}${fmt(dv)}% so với ${srcLabel(p)} ${fmt(decl)} ha`]);
  }
  const lat = numOf(curVal('lo', p, C.lat)), lon = numOf(curVal('lo', p, C.lon));
  if (lat != null && lon != null && !isNaN(lat) && !isNaN(lon)) {
    if (lat < 8 || lat > 24 || lon < 102 || lon > 110) out.push(['err', 'Vĩ độ/kinh độ nằm ngoài lãnh thổ Việt Nam – có thể bị nhập ngược']);
    else if (g && g.type === 'Polygon' && !pipRing(lon, lat, g.coordinates[0])) out.push(['warn', 'Điểm vĩ độ/kinh độ nằm ngoài ranh giới lô']);
  } else if (only4C) {
    out.push(['err', 'BPM bắt buộc có vĩ độ/kinh độ cho mỗi lô']);
  } else if (f) {
    const plots = DATA.lo.rows.filter(x => String(x.props[C.farm]).trim() === f.id);
    const largest = plots.slice().sort((x, y) => (numOf(y.props.DienTich_ha) || 0) - (numOf(x.props.DienTich_ha) || 0))[0];
    if (largest && largest.id === p.id) out.push(['err', 'GMR bắt buộc có vĩ độ/kinh độ cho lô lớn nhất của hộ']);
  }
  overlapChecks(p, g).forEach(o => out.push(o));
  if (!out.some(o => o[0] === 'err' || o[0] === 'warn')) out.unshift(['ok', `Dữ liệu ${only4C ? 'BPM' : 'GMR'} của lô và hộ này hợp lệ`]);
  return out;
}

// ---------- Chồng lấn: polygon với polygon, vùng bán kính của điểm (theo diện tích) với điểm/polygon khác ----------
const M_LAT = 110574;
const mLon = lat => 111320 * Math.cos(lat * Math.PI / 180);
function inGeom(x, y, g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  return polys.some(rs => pipRing(x, y, rs[0]) && !rs.slice(1).some(h => pipRing(x, y, h)));
}
function geomBB(g) {
  const ring = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates.flatMap(pp => pp[0]);
  return ring.reduce((b, c) => [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])], [999, 999, -999, -999]);
}
/** Hình của một lô để so chồng lấn: polygon, hoặc hình tròn quanh điểm có diện tích = diện tích khai báo. */
function shapeOf(g, pt, areaHaVal) {
  if (g) return { kind: 'poly', bb: geomBB(g), inside: (x, y) => inGeom(x, y, g) };
  if (!pt || !(areaHaVal > 0)) return null;
  const [lat, lng] = pt, r = Math.sqrt(areaHaVal * 10000 / Math.PI), dx = r / mLon(lat), dy = r / M_LAT;
  return { kind: 'pt', r, bb: [lng - dx, lat - dy, lng + dx, lat + dy],
    inside: (x, y) => { const a = (x - lng) * mLon(lat), b = (y - lat) * M_LAT; return a * a + b * b <= r * r; } };
}
const SHAPES = new WeakMap();
function plotShape(q) {
  const key = q.geometry || q.props;
  let s = SHAPES.get(key);
  if (s === undefined) { s = shapeOf(q.geometry, pointOf(q), numOf(q.props.DienTich_ha)); SHAPES.set(key, s); }
  return s;
}
/** Diện tích chồng lấn (m²) ước tính bằng lưới 24×24 điểm trong phần giao của hai khung bao. */
function overlapM2(a, b) {
  const x0 = Math.max(a.bb[0], b.bb[0]), y0 = Math.max(a.bb[1], b.bb[1]), x1 = Math.min(a.bb[2], b.bb[2]), y1 = Math.min(a.bb[3], b.bb[3]);
  if (x0 >= x1 || y0 >= y1) return 0;
  const N = 24, dx = (x1 - x0) / N, dy = (y1 - y0) / N;
  let n = 0;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = x0 + (i + 0.5) * dx, y = y0 + (j + 0.5) * dy;
    if (a.inside(x, y) && b.inside(x, y)) n++;
  }
  return n * dx * mLon((y0 + y1) / 2) * dy * M_LAT;
}
function overlapChecks(p, g) {
  let pt = null;
  const lat = numOf(curVal('lo', p, C.lat)), lon = numOf(curVal('lo', p, C.lon));
  if (!g && lat != null && lon != null && isFinite(lat) && isFinite(lon)) pt = [lat, lon];
  const me = shapeOf(g, pt, numOf(curVal('lo', p, 'DienTich_ha')));
  if (!me) return [];
  const hits = [];
  DATA.lo.rows.forEach(q => {
    if (q.id === p.id) return;
    const o = plotShape(q);
    if (!o || o.bb[0] > me.bb[2] || o.bb[2] < me.bb[0] || o.bb[1] > me.bb[3] || o.bb[3] < me.bb[1]) return;
    const m2 = overlapM2(me, o);
    if (m2 >= 10) hits.push([q.id, m2, o.kind]);
  });
  if (!hits.length) return [];
  hits.sort((x, y) => y[1] - x[1]);
  const list = hits.slice(0, 5).map(([id, m2, k]) => `${id}${k === 'pt' ? ' (điểm)' : ''} ~${Math.round(m2).toLocaleString('vi-VN')} m²`).join(', ') +
    (hits.length > 5 ? ` và ${hits.length - 5} lô khác` : '');
  return [['warn', me.kind === 'poly'
    ? `Polygon đang chồng lấn lên lô khác: ${list}`
    : `Vùng bán kính của điểm (~${Math.round(me.r)} m, theo diện tích khai báo) chồng lên lô khác: ${list}`]];
}

function renderChecks() {
  const p = byId[sel];
  if (!p || !$('#checks')) return;
  $('#checks').innerHTML = runChecks(p, farmOf(p)).map(([lv, t]) => `<div class="ck ${lv}">${esc(t)}</div>`).join('');
}

function showPlot(id, zoom) {
  const p = byId[id];
  if (!p) { sel = null; showList(); return; }
  if (zoom) zoomTo(id);
  const canEdit = DATA.user.canEdit;
  const f = farmOf(p);
  const area = p.geometry ? areaHa(p.geometry) : null;
  fidSeq = 0;
  const siblings = f ? DATA.lo.rows.filter(x => String(x.props[C.farm]).trim() === f.id) : [];
  const ctx = { nLo: siblings.length, nCrop: f && f.props.CayTrong ? 1 : 0 };

  let h = `<button class="link" id="back">← Danh sách</button>
    <h2>${f ? esc(farmName(f) || f.id) : esc(p.id)} ${tagsHtml(p)}</h2>`;
  // Tên chủ hộ trước, sau đó mã RA (mã lô · mã hộ) và mã 4C
  const prs = progsOf(p), pr4 = prs.filter(k => /^4C/.test(k));
  const ma4c = String(p.props.MaLo4C || (prs.includes('RA') ? (f && f.props.Ma4C) : p.id) || '').trim();
  h += `<div class="codes">`;
  if (prs.includes('RA') || !pr4.length) h += `<div>Mã RA: <b>${esc(p.id)}</b>${f ? ` <span class="muted">· hộ ${esc(f.id)}</span>` : ''}</div>`;
  if (pr4.length && ma4c) h += `<div>Mã ${esc(pr4.join(', '))}: <b>${esc(ma4c)}</b>${!prs.includes('RA') && f ? ` <span class="muted">· hộ ${esc(f.id)}</span>` : ''}</div>`;
  h += `</div>
    <div class="stats">
      Diện tích đo từ polygon: <b id="areaVal">${area != null ? fmtHa(area) : '—'}</b>
      · ${srcLabel(p)}: <b>${esc(p.props.DienTich_ha ?? '—')}</b> ha
    </div>`;
  if (p.props.__geomError) h += `<p class="err">Ô Polygon của lô này chứa dữ liệu không đọc được. Vẽ lại hoặc nhập lại từ KML.</p>`;
  if (!p.geometry) h += `<p class="muted">Lô chưa có ranh giới${pointOf(p) ? ' (đang hiện điểm GPS)' : ' và chưa có điểm GPS'}.</p>`;
  if (canEdit) {
    h += `<div class="row">
      ${!p.geometry && pointOf(p) ? '<button id="ptEdit">✎ Sửa Point</button>' : ''}
      <button id="gEdit">${p.geometry ? '✎ Sửa Polygon' : '✎ Vẽ Polygon'}</button>
      ${p.geometry ? '<button id="gDel" class="danger">Xóa Polygon</button>' : pointOf(p) ? '<button id="pDel" class="danger">Xóa Point</button>' : '<button id="pDel" class="danger">Xóa lô</button>'}
    </div><p class="hint" id="gHint" hidden></p>`;
  }
  h += `<div id="checks"></div>` + lastEditHtml(p, f);

  if (f) {
    h += `<div class="muted">Chương trình tham gia</div><div class="progs">`;
    C.programs.forEach(k => {
      h += `<label class="prog ro ${f.props[k] === true ? 'on' : ''}" style="border-left:5px solid ${PROG_COLOR[k] || NONE_COLOR}">
        <input type="checkbox" ${f.props[k] === true ? 'checked' : ''} disabled> ${esc(k)}</label>`;
    });
    h += `</div>`;
  }
  h += photosHtml(p);

  h += fieldsHtml(p, f, !canEdit, ctx);
  if (f) {
    if (siblings.length > 1) {
      h += `<div class="muted">Các lô khác của hộ: ` + siblings.filter(x => x.id !== p.id)
        .map(x => `<button class="link sib" data-id="${esc(x.id)}">${esc(x.id)}</button>`).join(', ') + `</div>`;
    }
  } else {
    h += `<p class="err">Không tìm thấy hộ "${esc(p.props[C.farm] || '')}" trong sheet NongHo.</p>`;
  }

  if (canEdit) {
    h += `<div class="actions"><button id="save" class="primary" disabled>Lưu thay đổi</button>
      <button id="cancel" disabled>Hủy</button></div>`;
  }
  $('#panelBody').innerHTML = h;
  renderChecks();
  initPhotos(p.id);

  $('#back').onclick = () => { if (confirmDiscard()) { sel = null; renderLayers(); showList(); } };
  $('#btnMore').onclick = () => {
    showMore = !showMore;
    $('#moreBox').hidden = !showMore;
    $('#btnMore').textContent = showMore ? '▲ Ẩn bớt' : '▼ Hiển thị thêm';
  };
  $('#panelBody').querySelectorAll('.sib').forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
  $('#panelBody').querySelectorAll('[data-k]').forEach(el => {
    if (el.readOnly || el.disabled) return;
    const evt = el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input';
    el.addEventListener(evt, () => {
      const kind = el.dataset.kind, col = el.dataset.k;
      const d = kind === 'ho' ? dirtyHo : dirtyLo;
      d[col] = el.type === 'checkbox' ? el.checked : el.value;
      if (PT && kind === 'lo' && (col === C.lat || col === C.lon)) {
        const la = numOf(curVal('lo', byId[sel], C.lat)), ln = numOf(curVal('lo', byId[sel], C.lon));
        if (la != null && ln != null && isFinite(la) && isFinite(ln) && Math.abs(la) <= 90 && Math.abs(ln) <= 180) setPointPos(L.latLng(la, ln), true);
      }
      const box = el.closest('.field') || el.closest('.prog');
      box.classList.add('changed');
      const m = metaOf(kind, col);
      if (kind === 'ho' && col === 'CCCD') {
        const info = cccdInfo(el.value);
        [['GioiTinh', info && info.gender], ['NamSinh', info && info.year]].forEach(([c2, v2]) => {
          const e2 = document.querySelector(`[data-kind="ho"][data-k="${c2}"]`);
          if (e2 && v2 != null) e2.value = v2;
        });
      }
      if (m && box.classList.contains('field')) {
        const e = fieldError(m, d[col]);
        box.classList.toggle('bad', !!e);
        const fe = box.querySelector('.ferr');
        if (fe) fe.textContent = e;
      }
      renderChecks();
      updateButtons();
    });
  });
  if (canEdit) {
    $('#gEdit').onclick = startGeomEdit;
    if ($('#ptEdit')) $('#ptEdit').onclick = startPointEdit;
    if ($('#gDel')) $('#gDel').onclick = removeGeom;
    if ($('#pDel')) $('#pDel').onclick = removePoint;
    $('#save').onclick = save;
    $('#cancel').onclick = () => cancelEdit(false);
  }
}

function updateButtons() {
  const s = $('#save'), c = $('#cancel');
  if (!s) return;
  s.disabled = !(Object.keys(dirtyLo).length || Object.keys(dirtyHo).length || geomChanged || geomRemoved);
  c.disabled = !hasUnsaved();
}

function currentGeom() { return geomEdit && geomEdit.layer ? geomEdit.layer.toGeoJSON().geometry : null; }

function onGeomChange() {
  geomChanged = true;
  const g = currentGeom();
  if (g && $('#areaVal')) $('#areaVal').textContent = fmtHa(areaHa(g)) + ' (chưa lưu)';
  renderChecks();
  updateButtons();
}

function startGeomEdit() {
  const p = byId[sel], layer = layerById[sel], hint = $('#gHint');
  if (p.geometry && layer && layer.pm) {
    layer.pm.enable({ allowSelfIntersection: false, snappable: true });
    layer.on('pm:edit pm:change', onGeomChange);
    geomEdit = { layer, isNew: false };
    gtAttach(layer, onGeomChange);
    hint.textContent = 'Kéo các đỉnh để sửa. Kéo chấm mờ giữa cạnh để thêm đỉnh. Nhấn 2 lần liên tiếp vào một đỉnh để xóa đỉnh đó. Nút ↶ Quay lại ở phía trên để hoàn tác.';
  } else {
    geomEdit = { layer: null, isNew: true };
    gtStartDraw();
    map.once('pm:create', e => {
      geomEdit.layer = e.layer;
      e.layer.setStyle({ color: SEL_COLOR, weight: 3, fillOpacity: 0.2 });
      e.layer.pm.enable({ allowSelfIntersection: false, snappable: true });
      e.layer.on('pm:edit pm:change', onGeomChange);
      gtAttach(e.layer, onGeomChange);
      onGeomChange();
    });
    hint.textContent = 'Chạm lần lượt vào các góc lô trên ảnh vệ tinh. Chạm lại điểm đầu tiên để khép kín, sau đó có thể kéo đỉnh để chỉnh. Nhấn 2 lần liên tiếp vào một đỉnh để xóa; nút ↶ Quay lại để hoàn tác.';
  }
  hint.hidden = false;
  $('#gEdit').disabled = true;
  if ($('#gDel')) $('#gDel').disabled = true;
  if ($('#pDel')) $('#pDel').disabled = true;
  updateButtons();
}

// ---------- Sửa Point: kéo điểm, chạm bản đồ, nhập tọa độ hoặc lấy GPS ----------
function setPointPos(ll, fromField) {
  if (!PT) return;
  PT.marker.setLatLng(ll);
  const lat = (+ll.lat).toFixed(6), lng = (+ll.lng).toFixed(6);
  dirtyLo[C.lat] = lat; dirtyLo[C.lon] = lng;
  if (!fromField) [[C.lat, lat], [C.lon, lng]].forEach(([c, v]) => {
    const el = document.querySelector(`[data-kind="lo"][data-k="${c}"]`);
    if (el) { el.value = v; const b = el.closest('.field'); if (b) b.classList.add('changed'); }
  });
  if ($('#ptPos')) $('#ptPos').textContent = `${lat}, ${lng}`;
  renderChecks();
  updateButtons();
}
function startPointEdit() {
  const p = byId[sel], pt = pointOf(p);
  if (!pt) return;
  const old = layerById[sel];
  if (old) old.setStyle({ opacity: 0.25, fillOpacity: 0.25 });
  const marker = L.marker(pt, { draggable: true, autoPan: true, zIndexOffset: 1000,
    icon: L.divIcon({ className: 'newpin', html: '<span></span>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
  PT = { marker };
  marker.on('dragend', () => setPointPos(marker.getLatLng()));
  const hint = $('#gHint');
  hint.innerHTML = `Kéo điểm cam tới vị trí đúng, hoặc chạm vào bản đồ để đặt lại điểm. Vị trí mới: <b id="ptPos">${pt[0].toFixed(6)}, ${pt[1].toFixed(6)}</b>
    <span class="row" style="margin-top:6px"><button type="button" id="ptCoord">⌖ Nhập tọa độ</button><button type="button" id="ptGps">📍 Vị trí của tôi</button></span>`;
  hint.hidden = false;
  $('#ptCoord').onclick = () => coordDialog(ll => { setPointPos(ll); panToVisible(ll, Math.max(map.getZoom(), 17)); }, marker.getLatLng());
  $('#ptGps').onclick = () => {
    if (!gpsSupported()) return toast('Thiết bị không hỗ trợ định vị.');
    const use = pos => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude), acc = Math.round(pos.coords.accuracy);
      if (acc > 30) toast(`Độ chính xác GPS hiện tại ±${acc} m. Có thể kéo điểm cam để chỉnh lại.`, 7000);
      setPointPos(ll); panToVisible(ll, Math.max(map.getZoom(), 17));
    };
    if (GPS.fix && Date.now() - GPS.fix.timestamp < 15000) return use(GPS.fix);
    const getFix = () => navigator.geolocation.getCurrentPosition(use, e => gpsError(e, getFix), { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    gpsEnsure(getFix);
  };
  ['ptEdit', 'gEdit', 'pDel'].forEach(k => { if ($('#' + k)) $('#' + k).disabled = true; });
  panToVisible(L.latLng(pt), Math.max(map.getZoom(), 17));
  updateButtons();
}
function stopPointEdit() {
  if (!PT) return;
  map.removeLayer(PT.marker);
  PT = null;
}

// Xóa point/polygon = xóa hẳn cả lô (dòng trong sheet Lo; bản sao lưu ở LichSu)
function removeGeom() { deletePlotUI(sel); }
function removePoint() { deletePlotUI(sel); }
function deletePlotUI(id) {
  const p = byId[id];
  if (!p) return;
  if (!confirm(`Xóa lô ${id}?\nLô sẽ bị xóa hẳn khỏi danh sách (cả vị trí và thông tin của lô). Bản sao được lưu ở sheet LichSu.`)) return;
  // Bỏ khỏi bản đồ và danh sách ngay, gửi lên máy chủ ở nền
  const idx = DATA.lo.rows.findIndex(x => x.id === id);
  if (idx >= 0) DATA.lo.rows.splice(idx, 1);
  delete byId[id];
  dataSig = null;
  if (layerById[id]) { plotGroup.removeLayer(layerById[id]); delete layerById[id]; }
  stopGeomTools();
  dirtyLo = {}; dirtyHo = {};
  sel = null;
  renderChips();
  renderLabels();
  showList();
  savesPending++;
  busy(true);
  saveChain = saveChain.then(async () => {
    try {
      await call('deletePlot', id);
      toast('Đã xóa lô ' + id + ' ✓', 3000);
    } catch (e) {
      const msg = String(e.message || e);
      if (/deletePlot/.test(msg)) {
        // Máy chủ chưa có chức năng xóa lô: tạm thời chỉ xóa vị trí
        toast('Máy chủ chưa cập nhật chức năng xóa lô – tạm thời chỉ xóa vị trí của lô ' + id + '.', 9000);
        try { await call('saveAll', { lo: { id, version: p.version, props: { [C.lat]: '', [C.lon]: '' }, geometry: p.geometry ? null : undefined } }); } catch (e2) {}
      } else {
        toast('Không xóa được lô ' + id + ': ' + msg + '. Đang tải lại dữ liệu…', 9000);
      }
      if (!hasUnsaved()) load(true);
    } finally {
      savesPending--;
      if (!savesPending) { busy(false); saveCacheSoon(); }
    }
  });
}

function stopGeomTools() {
  stopNew();
  stopPointEdit();
  gtStop();
  map.pm.disableDraw();
  map.off('pm:create');
  if (geomEdit && geomEdit.layer) {
    if (geomEdit.layer.pm) geomEdit.layer.pm.disable();
    if (geomEdit.isNew) map.removeLayer(geomEdit.layer);
  }
  geomEdit = null; geomChanged = false; geomRemoved = false;
}

function cancelEdit(silent) {
  stopGeomTools();
  dirtyLo = {}; dirtyHo = {};
  renderLayers();
  if (!silent && sel) showPlot(sel, false);
}

function save() {
  const p = byId[sel], f = farmOf(p);
  if (geomEdit && geomEdit.isNew && !geomEdit.layer) {
    toast('Bạn chưa vẽ xong: chạm lại vào điểm đầu tiên để khép kín polygon.');
    return;
  }
  let lo = null, ho = null;
  if (Object.keys(dirtyLo).length || geomRemoved || (geomEdit && geomChanged)) {
    lo = { props: Object.assign({}, dirtyLo) };
    if (geomRemoved) { lo.geometry = null; lo.props[C.lat] = ''; lo.props[C.lon] = ''; }
    else if (geomEdit && geomChanged) lo.geometry = currentGeom();
  }
  if (Object.keys(dirtyHo).length && f) ho = { id: f.id, props: Object.assign({}, dirtyHo) };
  stopGeomTools();
  dirtyLo = {}; dirtyHo = {};
  if (lo || ho) submitChanges(p.id, lo, ho);
  else showPlot(sel, false);
}

/**
 * Lưu kiểu "hiện ngay": cập nhật bản đồ và khung thông tin ngay lập tức, gửi lên máy chủ ở nền
 * (các lần lưu xếp hàng lần lượt). Lỗi thì báo và tải lại dữ liệu từ máy chủ.
 */
let saveChain = Promise.resolve(), savesPending = 0;
/** Dấu "Cập nhật gần nhất" hiện ngay trên máy (máy chủ ghi dấu thật khi lưu xong). */
function localStamp(act) {
  const now = new Date(), z = n => String(n).padStart(2, '0');
  return { [C.updated]: `${now.getFullYear()}-${z(now.getMonth() + 1)}-${z(now.getDate())} ${z(now.getHours())}:${z(now.getMinutes())}:${z(now.getSeconds())}`,
    [C.updatedBy]: DATA.user.name || DATA.user.email, [C.action || 'ThaoTacCuoi']: act };
}
function submitChanges(id, lo, ho) {
  const p0 = byId[id];
  if (lo && p0) {
    const p1 = Object.assign({}, p0, { props: Object.assign({}, p0.props, lo.props, localStamp(lo.geometry !== undefined
      ? (lo.geometry ? 'Sửa ranh giới' : 'Xóa ranh giới') : (lo.props[C.lat] !== undefined || lo.props[C.lon] !== undefined) ? 'Sửa vị trí điểm' : 'Sửa thông tin lô')) });
    if (lo.geometry !== undefined) p1.geometry = lo.geometry;
    replacePlot(p1);
  }
  if (ho && farms()[ho.id]) {
    const f0 = farms()[ho.id];
    farms()[ho.id] = Object.assign({}, f0, { props: Object.assign({}, f0.props, ho.props, localStamp('Sửa thông tin hộ')) });
  }
  refreshLayer(id);
  if (sel === id) showPlot(id, false);
  savesPending++;
  dataSig = null;
  busy(true);
  toast('Đang lưu…', 1500);
  saveChain = saveChain.then(async () => {
    const payload = {};
    if (lo) {
      payload.lo = { id, version: byId[id] ? byId[id].version : undefined, props: lo.props };
      if (lo.geometry !== undefined) payload.lo.geometry = lo.geometry;
    }
    if (ho) payload.ho = { id: ho.id, version: farms()[ho.id] ? farms()[ho.id].version : undefined, props: ho.props };
    try {
      const res = await call('saveAll', payload);
      const msgs = [];
      if (res.lo) {
        replacePlot(res.lo.item);
        if (res.lo.conflict) msgs.push('Lô vừa được ' + (res.lo.item.props[C.updatedBy] || 'người khác') + ' sửa lúc ' + res.lo.item.props[C.updated]);
      }
      if (res.ho) {
        farms()[res.ho.item.id] = res.ho.item;
        if (res.ho.conflict) msgs.push('Hộ vừa được ' + (res.ho.item.props[C.updatedBy] || 'người khác') + ' sửa lúc ' + res.ho.item.props[C.updated]);
      }
      if (msgs.length) toast(msgs.join('. ') + '. Đã tải bản mới nhất, vui lòng sửa lại.', 9000);
      else toast('Đã lưu ✓', 2000);
      if (!geomEdit) refreshLayer(id);
      if (sel === id && !hasUnsaved()) showPlot(id, false);
    } catch (e) {
      toast('Lỗi khi lưu: ' + (e.message || e) + '. Đang tải lại dữ liệu…', 9000);
      if (!hasUnsaved()) load(true);
    } finally {
      savesPending--;
      if (!savesPending) { busy(false); saveCacheSoon(); }
    }
  });
}

function replacePlot(plot) {
  dataSig = null;
  const i = DATA.lo.rows.findIndex(x => x.id === plot.id);
  if (i >= 0) DATA.lo.rows[i] = plot; else DATA.lo.rows.push(plot);
  byId[plot.id] = plot;
}

function openModal(title, html, importMode) {

  $('#mBody').innerHTML = html;
  $('#mFoot').hidden = !importMode;
  $('#modal').hidden = false;

// ---------- Nhập KML / KMZ ----------
function parseKml(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('File KML không đúng định dạng.');
  const byTag = (el, t) => Array.from(el.getElementsByTagNameNS('*', t));
  const first = (el, t) => byTag(el, t)[0];
  const txt = el => (el ? el.textContent.trim() : '');
  const ringOf = el => {
    const pts = txt(first(el, 'coordinates')).split(/\s+/).filter(Boolean)
      .map(s => s.split(',').map(Number))
      .filter(c => c.length >= 2 && isFinite(c[0]) && isFinite(c[1]))
      .map(c => [c[0], c[1]]);
    if (pts.length) {
      const a = pts[0], b = pts[pts.length - 1];
      if (a[0] !== b[0] || a[1] !== b[1]) pts.push([a[0], a[1]]);
    }
    return pts;
  };
  const out = [];
  byTag(doc, 'Placemark').forEach((pm, n) => {
    const props = {};
    byTag(pm, 'Data').forEach(d => { props[d.getAttribute('name')] = txt(first(d, 'value')); });
    byTag(pm, 'SimpleData').forEach(d => { props[d.getAttribute('name')] = txt(d); });
    const nameEl = Array.from(pm.children).find(c => c.localName === 'name');
    const name = txt(nameEl) || props.name || props.Name || ('Polygon ' + (n + 1));
    const polys = byTag(pm, 'Polygon').map(pg => {
      const rings = [];
      const outer = first(pg, 'outerBoundaryIs');
      if (outer) rings.push(ringOf(outer));
      byTag(pg, 'innerBoundaryIs').forEach(ib => rings.push(ringOf(ib)));
      return rings.length && rings[0].length >= 4 ? rings.filter(r => r.length >= 4) : [];
    }).filter(r => r.length);
    if (!polys.length) return;
    out.push({ name, props, geometry: polys.length === 1
      ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys } });
  });
  return out;
}

function guessId(f) {
  const key = Object.keys(f.props).find(k =>
    /^(ma_?lo|malo|ma_?thua|plot_?id|plot_?code|farm_?unit_?id|unit_?id|id|code)$/i.test(k.replace(/\s/g, '')));
  const cands = [key && f.props[key], f.name].filter(Boolean).map(s => String(s).trim());
  for (const c of cands) if (byId[c]) return c;
  for (const c of cands) {
    const hit = Object.keys(byId).find(id => id.toLowerCase() === c.toLowerCase());
    if (hit) return hit;
  }
  return cands[0] || '';
}

/** Mã hộ: lấy từ KML nếu có; lô có sẵn -> hộ hiện tại; NT-RA-A-04-01 -> NT-RA-A-04 */
function guessFarm(plotId, props) {
  const key = Object.keys(props).find(k => /^(ma_?ho|farm_?id|farmer_?id)$/i.test(k.replace(/\s/g, '')));
  if (key && props[key]) return String(props[key]).trim();
  if (byId[plotId]) return String(byId[plotId].props[C.farm] || '').trim();
  if (farms()[plotId]) return plotId;
  const base = plotId.replace(/-\d{1,3}$/, '');
  if (farms()[base]) return base;
  return /-\d+-\d{1,3}$/.test(plotId) ? base : plotId;
}

function statusOf(it, counts) {
  const id = it.id.trim();
  if (!it.include) return '<span class="muted">Bỏ qua</span>';
  if (!id) return '<span class="err">Cần nhập mã lô</span>';
  if (counts[id] > 1) return '<span class="err">Trùng mã</span>';
  const p = byId[id];
  if (p) return p.geometry ? '<span style="color:var(--warn)">Ghi đè ranh giới cũ</span>' : 'Gán vào lô có sẵn';
  if (!$('#mAllowNew').checked) return '<span class="err">Chưa có lô này</span>';
  if (!it.farmId.trim()) return '<span class="err">Cần mã hộ</span>';
  return farms()[it.farmId.trim()] ? 'Tạo lô mới' : '<span style="color:var(--warn)">Tạo lô + hộ mới</span>';
}

function refreshImportStatus() {
  const counts = {};
  importItems.forEach(it => { if (it.include && it.id.trim()) counts[it.id.trim()] = (counts[it.id.trim()] || 0) + 1; });
  let n = 0;
  importItems.forEach((it, i) => {
    const st = statusOf(it, counts);
    $('#st' + i).innerHTML = st;
    if (!/class="(err|muted)"/.test(st)) n++;
  });
  $('#mOk').textContent = 'Nhập ' + n + ' polygon';
  $('#mOk').disabled = n === 0;
}

function openImport(feats, fileName) {
  importItems = feats.map(f => {
    const id = guessId(f);
    return { ...f, id, farmId: guessFarm(id, f.props), include: true, area: areaHa(f.geometry) };
  });
  if (importLayer) map.removeLayer(importLayer);
  importLayer = L.featureGroup(importItems.map(it => L.geoJSON(it.geometry, {
    style: { color: IMP_COLOR, weight: 2, dashArray: '6 4', fillOpacity: 0.1 }
  }))).addTo(map);
  map.fitBounds(importLayer.getBounds(), { padding: [20, 20], maxZoom: 18 });

  let h = `<p class="muted">Kiểm tra mã lô và mã hộ cho từng polygon (đường cam nét đứt). Bấm vào tên để phóng tới polygon.</p>
    <datalist id="ids">${Object.keys(byId).map(id => `<option value="${esc(id)}">`).join('')}</datalist>
    <datalist id="fids">${Object.keys(farms()).map(id => `<option value="${esc(id)}">`).join('')}</datalist>
    <table><thead><tr><th></th><th>Tên trong file</th><th>Diện tích</th><th>Mã lô</th><th>Mã hộ</th><th>Kết quả</th></tr></thead><tbody>`;
  importItems.forEach((it, i) => {
    h += `<tr><td><input type="checkbox" data-inc="${i}" checked></td>
      <td class="name" data-zoom="${i}">${esc(it.name)}</td><td>${fmtHa(it.area)}</td>
      <td><input type="text" list="ids" data-id="${i}" value="${esc(it.id)}"></td>
      <td><input type="text" list="fids" data-fid="${i}" value="${esc(it.farmId)}"></td>
      <td id="st${i}"></td></tr>`;
  });
  h += '</tbody></table><div id="mErr"></div>';
  openModal(fileName + ' – ' + importItems.length + ' polygon', h, true);

  $('#mProgs').innerHTML = '<b>RA</b>';
  $('#mBody').querySelectorAll('[data-inc]').forEach(el => el.addEventListener('change', () => {
    importItems[el.dataset.inc].include = el.checked; refreshImportStatus();
  }));
  $('#mBody').querySelectorAll('[data-id]').forEach(el => el.addEventListener('input', () => {
    importItems[el.dataset.id].id = el.value; refreshImportStatus();
  }));
  $('#mBody').querySelectorAll('[data-fid]').forEach(el => el.addEventListener('input', () => {
    importItems[el.dataset.fid].farmId = el.value; refreshImportStatus();
  }));
  $('#mBody').querySelectorAll('[data-zoom]').forEach(el => el.addEventListener('click', () => {
    map.fitBounds(L.geoJSON(importItems[el.dataset.zoom].geometry).getBounds(), { padding: [30, 30], maxZoom: 19 });
  }));
  refreshImportStatus();
}

async function doImport() {
  const allowNew = $('#mAllowNew').checked;
  const programs = {};
  document.querySelectorAll('[data-np]').forEach(el => { programs[el.dataset.np] = el.checked; });
  const items = importItems.filter(it => it.include && it.id.trim())
    .map(it => ({ id: it.id.trim(), farmId: it.farmId.trim(), geometry: it.geometry, createNew: allowNew }));
  busy(true);
  $('#mOk').disabled = true;
  try {
    const r = await call('importPlots', items, { programs });

// Tải thư viện khi cần (không tải lúc mở trang)
function loadScript_(src, globalName) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = src; sc.onload = ok; sc.onerror = () => fail(new Error('Không tải được thư viện ' + globalName));
    document.head.appendChild(sc);
  });
}

async function readKmlFile(f) {
  if (/\.kmz$/i.test(f.name)) {
    await loadScript_('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip');
    const zip = await JSZip.loadAsync(f);
    const files = Object.values(zip.files).filter(z => !z.dir && /\.kml$/i.test(z.name));
    const kml = files.find(z => /(^|\/)doc\.kml$/i.test(z.name)) || files[0];
    if (!kml) throw new Error('Không tìm thấy file .kml bên trong KMZ.');
    return kml.async('string');
  }
  return f.text();
}

  try { if ((await navigator.permissions.query({ name: 'geolocation' })).state === 'granted') gpsStart(true); } catch (e) {}
})();
map.on('dragstart', () => { if (GPS.follow) { GPS.follow = false; gpsStyle(); } });
$('#gps').addEventListener('click', () => { if (GPS.inPlot) select(GPS.inPlot.id); });

// ---------- Ảnh mảnh vườn ----------
const PHOTOS = {};                 // MaLo -> danh sách ảnh (có ảnh thu nhỏ)
const FULL = new Map();            // FileId -> ảnh gốc (data URL), giữ tối đa 12 ảnh
const photoCount = id => PHOTOS[id] ? PHOTOS[id].length : ((DATA.photos || {})[id] || 0);
const UPLOADING = {};              // MaLo -> câu báo tiến độ

function photosHtml(p) {

function initPhotos(id) {
  if ($('#phAdd')) {
    $('#phAdd').onclick = () => { $('#phSrc').hidden = !$('#phSrc').hidden; };

    ['#phInCam', '#phInLib'].forEach(s => $(s).addEventListener('change', e => {

    }));
