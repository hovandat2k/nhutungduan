function saveBlob(name, mime, b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function downloadOne(btn, code, kind) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Đang tạo…';
  busy(true);
  try {
    const r = await call('downloadFile', code, kind);
    saveBlob(r.name, r.mime, r.data);
    $('#dlMsg').innerHTML = `Đã tải <b>${esc(r.name)}</b> (${r.farms} hộ · ${r.plots} lô)` +
      (r.url ? ` · <a href="${esc(r.url)}" target="_blank" rel="noopener">mở bản trên Drive</a>` : '');
  } catch (e) {
    $('#dlMsg').innerHTML = '<span class="err">Không tạo được ' + esc(code + ' ' + kind.toUpperCase()) + ': ' + esc(e.message || e) + '</span>';
  } finally {
    btn.disabled = false; btn.textContent = label;
    busy(false);
  }
}

// ---------- Vị trí hiện tại (GPS) ----------
const GPS = { watch: null, follow: false, fix: null, marker: null, acc: null, ctrl: null, first: true, inPlot: null };

function gpsSupported() {
  if (!navigator.geolocation) { toast('Trình duyệt này không hỗ trợ định vị.'); return false; }
  return true;
}
function gpsError(e) {
  const msg = e.code === 1
    ? 'Chưa được phép dùng vị trí. Hãy bật Vị trí (GPS) trên điện thoại và cho phép trang này truy cập vị trí (biểu tượng ổ khóa cạnh thanh địa chỉ → Quyền → Vị trí).'
    : e.code === 3 ? 'Không lấy được vị trí (hết thời gian chờ). Hãy ra chỗ thoáng và thử lại.'
    : 'Không lấy được vị trí: ' + (e.message || 'lỗi không xác định');
  toast(msg, 10000);
  if (e.code === 1) { gpsStop(); gpsRemember(false); }
}
function plotAt(lat, lng) {
  for (const p of DATA.lo.rows) {
    const g = p.geometry;
    if (!g) continue;
    if (!p._bb) {
      const ring = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates.flatMap(pp => pp[0]);
      p._bb = ring.reduce((b, c) => [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])], [999, 999, -999, -999]);
    }
    const b = p._bb;
    if (lng < b[0] || lng > b[2] || lat < b[1] || lat > b[3]) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    if (polys.some(rings => pipRing(lng, lat, rings[0]) && !rings.slice(1).some(h => pipRing(lng, lat, h)))) return p;
  }
  return null;
}
function gpsUpdateBadge() {
  const el = $('#gps');
  if (!GPS.fix) { el.hidden = true; return; }
  const acc = Math.round(GPS.fix.coords.accuracy);
  const p = GPS.inPlot;
  const f = p ? farmOf(p) : null;
  el.innerHTML = `📍 ±${acc} m · ` + (p ? `trong lô <b>${esc(p.id)}</b>${f ? ' · ' + esc(farmName(f)) : ''}` : 'ngoài các lô đã có ranh giới');
  el.hidden = false;
}
function gpsOnFix(pos) {
  GPS.fix = pos;
  const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
  if (!GPS.marker) {
    GPS.acc = L.circle(ll, { radius: pos.coords.accuracy, color: '#1a73e8', weight: 1, fillColor: '#1a73e8', fillOpacity: 0.12, interactive: false }).addTo(map);
    GPS.marker = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    GPS.marker.bindTooltip('Vị trí của bạn');
  } else {
    GPS.marker.setLatLng(ll);
    GPS.acc.setLatLng(ll).setRadius(pos.coords.accuracy);
  }
  headDraw();
  GPS.inPlot = DATA ? plotAt(ll.lat, ll.lng) : null;
  gpsUpdateBadge();
  if (GPS.first) { GPS.first = false; panToVisible(ll, Math.max(map.getZoom(), 17)); }
  else if (GPS.follow) panToVisible(ll);
}
// ---------- Hướng điện thoại (la bàn của máy): hình quạt xanh trên chấm vị trí ----------
const HEAD = { listening: false, deg: null, marker: null, raf: 0, evt: null };
function headFromEvent(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;   // iPhone
  else if (e.alpha != null && (e.absolute || HEAD.evt === 'deviceorientationabsolute')) h = 360 - e.alpha;        // Android
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = ((h + so) % 360 + 360) % 360;
  // làm mượt (tránh nhảy qua 0°/360°)
  if (HEAD.deg == null) HEAD.deg = h;
  else { const d = ((h - HEAD.deg) % 360 + 540) % 360 - 180; HEAD.deg += d * 0.3; }   // không quy về 0–360 để hình quạt không quay ngược một vòng
  if (!HEAD.raf) HEAD.raf = requestAnimationFrame(() => { HEAD.raf = 0; headDraw(); });
}
function headStart() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  const needAsk = typeof DeviceOrientationEvent.requestPermission === 'function';
  if (HEAD.listening && (HEAD.granted || !needAsk)) return;
  if (!HEAD.listening) {
    HEAD.evt = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
    window.addEventListener(HEAD.evt, headFromEvent);   // máy không cần xin quyền thì có dữ liệu ngay
    HEAD.listening = true;
  }
  // iPhone (và Chrome mới) cần xin quyền, chỉ được khi người dùng vừa bấm nút; chưa được thì lần bấm ◎ sau xin lại
  if (needAsk) DeviceOrientationEvent.requestPermission().then(st => { HEAD.granted = st === 'granted'; }).catch(() => {});
}
function headStop() {
  if (HEAD.listening) window.removeEventListener(HEAD.evt, headFromEvent);
  HEAD.listening = false; HEAD.deg = null; HEAD.granted = false;
  if (HEAD.marker) { map.removeLayer(HEAD.marker); HEAD.marker = null; }
}
function headDraw() {
  if (HEAD.deg == null || !GPS.marker) return;
  const ll = GPS.marker.getLatLng();
  if (!HEAD.marker) {
    HEAD.marker = L.marker(ll, { interactive: false, keyboard: false, zIndexOffset: -1000,
      icon: L.divIcon({ className: 'headcone', iconSize: [96, 96], iconAnchor: [48, 48],
        html: '<svg width="96" height="96" viewBox="-48 -48 96 96"><defs><radialGradient id="hcg" cx="0" cy="0" r="46" gradientUnits="userSpaceOnUse">' +
          '<stop offset="0.2" stop-color="#1a73e8" stop-opacity=".75"/><stop offset="1" stop-color="#1a73e8" stop-opacity="0"/></radialGradient></defs>' +
          '<path d="M-4.2 -10.2 L-19.5 -41.7 A46 46 0 0 1 19.5 -41.7 L4.2 -10.2 A11 11 0 0 0 -4.2 -10.2 Z" fill="url(#hcg)"/></svg>' })
    }).addTo(map);
  } else HEAD.marker.setLatLng(ll);
  const svg = HEAD.marker._icon && HEAD.marker._icon.firstChild;
  if (svg) svg.style.transform = 'rotate(' + ((map.getBearing() || 0) + HEAD.deg) + 'deg)';
}
map.on('rotate', headDraw);

const GPS_KEY = 'lv_gps';
function gpsRemember(v) { try { localStorage.setItem(GPS_KEY, v ? '1' : '0'); } catch (e) {} }
function gpsStart(quiet) {
  if (!gpsSupported()) return;
  GPS.first = !quiet; GPS.follow = !quiet;
  gpsRemember(true);
  GPS.watch = navigator.geolocation.watchPosition(gpsOnFix, gpsError, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
  headStart();
  gpsStyle();
  if (!quiet) toast('Đang lấy vị trí…', 2500);
}
function gpsStop() {
  if (GPS.watch != null) navigator.geolocation.clearWatch(GPS.watch);
  GPS.watch = null; GPS.follow = false; GPS.fix = null; GPS.inPlot = null;
  if (GPS.marker) { map.removeLayer(GPS.marker); map.removeLayer(GPS.acc); GPS.marker = GPS.acc = null; }
  headStop();
  gpsUpdateBadge();
  gpsStyle();
}
function gpsStyle() {
  const el = GPS.ctrl && GPS.ctrl.getContainer();
  if (!el) return;
  el.classList.toggle('on', GPS.watch != null);
  el.classList.toggle('follow', GPS.watch != null && GPS.follow);
}
const LocateCtl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control locate');
    const a = L.DomUtil.create('a', '', div);
    a.href = '#'; a.title = 'Vị trí của tôi'; a.setAttribute('role', 'button'); a.textContent = '◎';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(a, 'click', e => {
      L.DomEvent.preventDefault(e);
      if (GPS.watch == null) gpsStart();
      else if (!GPS.follow) { headStart(); GPS.follow = true; gpsStyle(); if (GPS.fix) panToVisible(L.latLng(GPS.fix.coords.latitude, GPS.fix.coords.longitude), Math.max(map.getZoom(), 17)); }
      else { gpsStop(); gpsRemember(false); }
    });
    return div;
  }
});
GPS.ctrl = new LocateCtl().addTo(map);
// Lần sau mở trang: nếu đã bật vị trí và trình duyệt đã cho phép thì tự hiện vị trí, không hỏi lại
(async () => {
  let want = false;
  try { want = localStorage.getItem(GPS_KEY) === '1'; } catch (e) {}
  if (!want || !navigator.geolocation || !navigator.permissions) return;
  try { if ((await navigator.permissions.query({ name: 'geolocation' })).state === 'granted') gpsStart(true); } catch (e) {}
})();
map.on('dragstart', () => { if (GPS.follow) { GPS.follow = false; gpsStyle(); } });
$('#gps').addEventListener('click', () => { if (GPS.inPlot) select(GPS.inPlot.id); });

// ---------- Ảnh mảnh vườn ----------
const PHOTOS = {};                 // MaLo -> danh sách ảnh (có ảnh thu nhỏ)
const FULL = new Map();            // FileId -> ảnh gốc (data URL), giữ tối đa 12 ảnh
const photoCount = id => PHOTOS[id] ? PHOTOS[id].length : ((DATA.photos || {})[id] || 0);
const UPLOADING = {};              // MaLo -> câu báo tiến độ

function photosHtml(p) {
  const n = photoCount(p.id);
  return `<div class="photos"><div class="ph-head"><b>Ảnh mảnh vườn</b>
      <span class="muted" id="phCount">${n ? n + ' ảnh' : 'chưa có ảnh'}</span></div>
    <div class="ph-grid" id="phGrid">${n ? '<span class="muted">Đang tải ảnh…</span>' : ''}</div>
    <div class="muted" id="phProg">${esc(UPLOADING[p.id] || '')}</div>
    ${DATA.user.canEdit ? `<button type="button" class="ph-add" id="phAdd">📷 Thêm ảnh</button>
      <div class="row ph-src" id="phSrc" hidden>
        <button type="button" id="phCam">📸 Chụp ảnh mới</button>
        <button type="button" id="phLib">🖼 Chọn từ thư viện</button>
      </div>
      <input type="file" id="phInCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="phInLib" accept="image/*" multiple hidden>` : ''}
  </div>`;
}

function initPhotos(id) {
  if ($('#phAdd')) {
    $('#phAdd').onclick = () => { $('#phSrc').hidden = !$('#phSrc').hidden; };
    $('#phCam').onclick = () => { $('#phInCam').value = ''; $('#phInCam').click(); };
    $('#phLib').onclick = () => { $('#phInLib').value = ''; $('#phInLib').click(); };
    ['#phInCam', '#phInLib'].forEach(s => $(s).addEventListener('change', e => {
      $('#phSrc').hidden = true;
      uploadPhotos(id, e.target.files);
    }));
  }
  loadPhotos(id);
}

function renderPhotoGrid(id) {
  const g = $('#phGrid');
  if (!g || sel !== id) return;
  const list = PHOTOS[id] || [];
  $('#phCount').textContent = list.length ? list.length + ' ảnh' : 'chưa có ảnh';
  g.innerHTML = list.map((ph, i) =>
    `<button type="button" class="ph" data-i="${i}" title="${esc(ph.time)} · ${esc(ph.by)}">${ph.thumb ? `<img src="${esc(ph.thumb)}" alt="Ảnh ${i + 1}" loading="lazy">` : '🖼'}</button>`).join('');
  g.querySelectorAll('.ph').forEach(el => { el.onclick = () => openPhoto(id, Number(el.dataset.i)); });
}

async function loadPhotos(id, force) {
  if (!force && PHOTOS[id]) { renderPhotoGrid(id); return; }
  if (!force && !photoCount(id)) { PHOTOS[id] = []; renderPhotoGrid(id); return; }
  try {
    PHOTOS[id] = await call('listPhotos', id);
    DATA.photos[id] = PHOTOS[id].length;
    renderPhotoGrid(id);
  } catch (e) {
    if ($('#phGrid') && sel === id) $('#phGrid').innerHTML = '<span class="err">Không tải được ảnh: ' + esc(e.message || e) + '</span>';
  }
}

function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({ img, u });
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('không đọc được file ' + file.name)); };
    img.src = u;
  });
}
function toJpeg(img, max, q) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * k));
  c.height = Math.max(1, Math.round(img.naturalHeight * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function setPhotoProg(id, msg) {
  if (msg) UPLOADING[id] = msg; else delete UPLOADING[id];
  if (sel === id && $('#phProg')) $('#phProg').textContent = msg || '';
}

/** Thu nhỏ ảnh (cạnh dài 1600 px) rồi gửi lên; ảnh lưu riêng theo mã lô. */
async function uploadPhotos(id, files) {
  files = Array.from(files || []);
  if (!files.length) return;
  if (!PHOTOS[id]) await loadPhotos(id, true);
  const fix = GPS.fix && Date.now() - GPS.fix.timestamp < 60000 ? GPS.fix.coords : null;
  let ok = 0;
  busy(true);
  for (let i = 0; i < files.length; i++) {
    setPhotoProg(id, `Đang lưu ảnh ${i + 1}/${files.length}…`);
    try {
      const { img, u } = await loadImg(files[i]);
      const data = toJpeg(img, 1600, 0.82), thumb = toJpeg(img, 240, 0.7);
      URL.revokeObjectURL(u);
      const ph = await call('addPhoto', { plot: id, data, thumb,
        lat: fix ? fix.latitude.toFixed(6) : '', lon: fix ? fix.longitude.toFixed(6) : '' });
      (PHOTOS[id] = PHOTOS[id] || []).unshift(ph);
      DATA.photos[id] = PHOTOS[id].length;
      FULL.set(ph.fileId, data);
      ok++;
      renderPhotoGrid(id);
    } catch (e) {
      toast('Không lưu được ảnh: ' + (e.message || e), 9000);
    }
  }
  setPhotoProg(id, '');
  busy(false);
  if (ok) toast(`Đã lưu ${ok} ảnh cho lô ${id} ✓`);
}

async function openPhoto(id, i) {
  const list = PHOTOS[id] || [], ph = list[i];
  if (!ph) return;
  const canDel = DATA.user.canEdit && (DATA.user.isAdmin || String(ph.by).toLowerCase() === String(DATA.user.email).toLowerCase());
  openModal(`Ảnh lô ${id} · ${i + 1}/${list.length}`, `<div class="ph-view"><img id="phBig" src="${esc(FULL.get(ph.fileId) || ph.thumb)}" alt=""></div>
    <p class="muted">${esc(ph.time)} · ${esc(ph.by)}${ph.lat !== '' && ph.lat != null ? ' · 📍 ' + esc(ph.lat) + ', ' + esc(ph.lon) : ''}
      <span id="phLoad">${FULL.has(ph.fileId) ? '' : ' · đang tải ảnh gốc…'}</span></p>
    <div class="row">
      <button type="button" id="phPrev" ${i > 0 ? '' : 'disabled'}>← Trước</button>
      <button type="button" id="phNext" ${i < list.length - 1 ? '' : 'disabled'}>Sau →</button>
      <a id="phDl" download="${esc(ph.name || 'anh.jpg')}" hidden><button type="button">⬇ Tải về</button></a>
      ${canDel ? '<button type="button" class="danger" id="phDel">Xóa ảnh</button>' : ''}
    </div>`, false);
  $('#phPrev').onclick = () => openPhoto(id, i - 1);
  $('#phNext').onclick = () => openPhoto(id, i + 1);
  if ($('#phDel')) $('#phDel').onclick = async () => {
    if (!confirm('Xóa ảnh này? (Ảnh được chuyển vào Thùng rác của Google Drive)')) return;
    busy(true);
    try {
      await call('deletePhoto', ph.fileId);
      list.splice(list.indexOf(ph), 1);
      DATA.photos[id] = list.length;
      FULL.delete(ph.fileId);
      closeModal();
      renderPhotoGrid(id);
      toast('Đã xóa ảnh ✓');
    } catch (e) { toast('Không xóa được: ' + (e.message || e), 9000); }
    finally { busy(false); }
  };
  const show = url => {
    if (!$('#phBig') || $('#mTitle').textContent.indexOf(`${i + 1}/`) < 0) return;
    $('#phBig').src = url; $('#phLoad').textContent = '';
    $('#phDl').href = url; $('#phDl').hidden = false;
  };
  if (FULL.has(ph.fileId)) { show(FULL.get(ph.fileId)); return; }
  try {
    const r = await call('getPhoto', ph.fileId);
    const url = 'data:' + r.mime + ';base64,' + r.data;
    FULL.set(ph.fileId, url);
    if (FULL.size > 12) FULL.delete(FULL.keys().next().value);
    show(url);
  } catch (e) {
    if ($('#phLoad')) $('#phLoad').textContent = ' · không tải được ảnh gốc: ' + (e.message || e);
  }
}

// ---------- Tạo lô mới: điểm hoặc polygon (nút + dưới nút vị trí) ----------
// ---------- Thanh công cụ khi vẽ / sửa polygon: diện tích + Quay lại + nhấn 2 lần xóa đỉnh ----------
const DRAW_OPTS = { allowSelfIntersection: false, snappable: true };
const GT = { on: false, layer: null, draw: null, hist: [], onChange: null, lastTap: null, provMarker: null, merge: false };
const llCopy = v => Array.isArray(v) ? v.map(llCopy) : L.latLng(v.lat, v.lng);
const llKey = v => JSON.stringify(v, (k, x) => x && x.lat != null ? [+x.lat.toFixed(8), +x.lng.toFixed(8)] : x);

function gtShow(on) {
  GT.on = on;
  $('#geoBar').hidden = !on;
  $('#mapWrap').classList.toggle('editing', on);
  if (on) map.doubleClickZoom.disable(); else map.doubleClickZoom.enable();
}
function gtArea() {
  if (!GT.on) return;
  let a = null;
  try {
    if (GT.layer) a = areaHa(GT.layer.toGeoJSON().geometry);
    else if (GT.draw) {
      const pts = GT.draw.getLatLngs().map(q => [q.lng, q.lat]);
      if (pts.length >= 3) a = areaHa({ type: 'Polygon', coordinates: [pts.concat([pts[0]])] });
    }
  } catch (e) { a = null; }
  $('#geoArea').textContent = a != null ? fmtHa(a) : (GT.draw ? 'chạm thêm góc lô…' : '—');
  $('#geoUndo').disabled = GT.layer ? GT.hist.length < 2 : !(GT.draw && GT.draw.getLatLngs().length);
}
function gtStartDraw() {
  gtStop();
  gtShow(true);
  map.pm.enableDraw('Polygon', DRAW_OPTS);
  gtArea();
}
map.on('pm:drawstart', e => {
  if (!GT.on || GT.layer) return;
  GT.draw = e.workingLayer;
  GT.draw.on('pm:vertexadded pm:vertexremoved', () => setTimeout(gtArea, 0));
  gtArea();
});
const GT_EVENTS = {
  'pm:edit': () => {
    const cur = llCopy(GT.layer.getLatLngs());
    if (GT.merge) { GT.merge = false; GT.hist[GT.hist.length - 1] = cur; }    // kéo đỉnh mới thêm: gộp thành 1 bước
    else if (llKey(cur) !== llKey(GT.hist[GT.hist.length - 1])) GT.hist.push(cur);
    if (GT.hist.length > 100) GT.hist.shift();
    gtArea();
  },
  'pm:vertexadded': e => { GT.provMarker = e.marker; },
  'pm:markerdragend': e => { if (GT.provMarker && e.markerEvent && e.markerEvent.target === GT.provMarker) GT.merge = true; GT.provMarker = null; },
  'pm:change': () => setTimeout(gtArea, 0),
  'pm:vertexclick': e => {
    const m = e.markerEvent && e.markerEvent.target, now = Date.now();
    if (m && GT.lastTap && GT.lastTap.m === m && now - GT.lastTap.t < 500) {
      GT.lastTap = null;
      const n = GT.layer.getLatLngs().flat(3).length;
      if (n <= 3) { toast('Polygon cần ít nhất 3 đỉnh.'); return; }
      try { GT.layer.pm._removeMarker({ target: m }); } catch (err) { toast('Không xóa được đỉnh này.'); }
    } else GT.lastTap = { m, t: now };
  }
};
function gtAttach(layer, onChange) {
  if (GT.layer) GT.layer.off(GT_EVENTS);
  gtShow(true);
  GT.draw = null; GT.layer = layer; GT.onChange = onChange; GT.lastTap = null; GT.merge = false;
  GT.hist = [llCopy(layer.getLatLngs())];
  layer.on(GT_EVENTS);
  gtArea();
}
function gtUndo() {
  if (GT.layer) {
    if (GT.hist.length < 2) return;
    GT.hist.pop();
    const l = GT.layer;
    l.pm.disable();
    l.setLatLngs(llCopy(GT.hist[GT.hist.length - 1]));
    l.pm.enable(DRAW_OPTS);
    if (GT.onChange) GT.onChange();
    gtArea();
  } else if (GT.draw) {
    const d = map.pm.Draw.Polygon;
    if ((d._markers || []).length > 1) d._removeLastVertex();
    else { map.pm.disableDraw(); map.pm.enableDraw('Polygon', DRAW_OPTS); }
    setTimeout(gtArea, 0);
  }
}
function gtStop() {
  if (GT.layer) GT.layer.off(GT_EVENTS);
  Object.assign(GT, { layer: null, draw: null, hist: [], onChange: null, lastTap: null, provMarker: null, merge: false });
  gtShow(false);
}
$('#geoUndo').addEventListener('click', gtUndo);
L.DomEvent.disableClickPropagation($('#geoBar'));

let NEW = null;   // { mode: 'point' | 'poly', picking, layer, latlng, acc }

const AddCtl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control addctl');
    const a = L.DomUtil.create('a', '', div);
    a.href = '#'; a.title = 'Tạo điểm hoặc polygon mới'; a.setAttribute('role', 'button'); a.textContent = '+';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); openAddMenu(); });
    return div;
  }
});
new AddCtl().addTo(map);

function openAddMenu() {
  if (!DATA) return;
  if (!DATA.user.canEdit) { toast('Tài khoản của bạn chỉ có quyền xem.'); return; }
  if (!confirmDiscard()) return;
  openModal('Tạo lô mới', `<div class="addmenu">
      <button type="button" data-add="gps"><span class="ic">📍</span><b>Điểm tại vị trí của tôi</b><span class="muted">Lấy tọa độ GPS của điện thoại</span></button>
      <button type="button" data-add="tap"><span class="ic">📌</span><b>Điểm chọn trên bản đồ</b><span class="muted">Chạm vào vị trí trên ảnh vệ tinh</span></button>
      <button type="button" data-add="poly"><span class="ic">⬠</span><b>Vẽ polygon mới</b><span class="muted">Chạm lần lượt vào các góc lô</span></button>
    </div>`, false);
  $('#mBody').querySelectorAll('[data-add]').forEach(b => { b.onclick = () => { closeModal(); startNew(b.dataset.add); }; });
}

function newPanel(msg) {
  $('#panelBody').innerHTML = `<button class="link" id="newCancel">✕ Hủy tạo mới</button><h2>Tạo lô mới</h2>
    <p class="hint">${esc(msg)}</p>`;
  $('#newCancel').onclick = cancelNew;
}

function startNew(how) {
  if (sel) { sel = null; renderLayers(); }
  NEW = { mode: how === 'poly' ? 'poly' : 'point', picking: false, layer: null, latlng: null };
  $('#bar').classList.remove('open');
  if (how === 'gps') {
    if (!gpsSupported()) { NEW.picking = true; newPanel('Chạm vào vị trí trên bản đồ để đặt điểm.'); return; }
    newPanel('Đang lấy vị trí của bạn…');
    setSheet('half');
    const use = pos => {
      if (!NEW || NEW.latlng) return;
      const acc = Math.round(pos.coords.accuracy);
      if (acc > 30) toast(`Độ chính xác GPS hiện tại ±${acc} m. Có thể kéo điểm cam để chỉnh lại.`, 7000);
      setNewPoint(L.latLng(pos.coords.latitude, pos.coords.longitude), acc);
    };
    if (GPS.fix && Date.now() - GPS.fix.timestamp < 15000) use(GPS.fix);
    else navigator.geolocation.getCurrentPosition(use, e => {
      gpsError(e);
      if (NEW && !NEW.latlng) { NEW.picking = true; newPanel('Không lấy được GPS. Chạm vào bản đồ để chọn vị trí.'); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } else if (how === 'tap') {
    NEW.picking = true;
    newPanel('Chạm vào vị trí trên bản đồ để đặt điểm.');
    setSheet('peek');
  } else {
    newPanel('Chạm lần lượt vào các góc lô trên ảnh vệ tinh. Chạm lại điểm đầu tiên để khép kín, sau đó có thể kéo đỉnh để chỉnh. Nhấn 2 lần liên tiếp vào một đỉnh để xóa; nút ↶ Quay lại để hoàn tác.');
    setSheet('peek');
    gtStartDraw();
    map.once('pm:create', e => {
      if (!NEW) { map.removeLayer(e.layer); return; }
      NEW.layer = e.layer;
      e.layer.setStyle({ color: IMP_COLOR, weight: 3, fillOpacity: 0.2 });
      e.layer.pm.enable({ allowSelfIntersection: false, snappable: true });
      e.layer.on('pm:edit pm:change', updateNewInfo);
      gtAttach(e.layer, updateNewInfo);
      showNewForm();
      setSheet('half');
    });
  }
}

map.on('click', e => { if (NEW && NEW.picking) setNewPoint(e.latlng); });

function setNewPoint(ll, acc) {
  NEW.picking = false; NEW.latlng = ll; NEW.acc = acc;
  if (NEW.layer) NEW.layer.setLatLng(ll);
  else {
    NEW.layer = L.marker(ll, { draggable: true, autoPan: true,
      icon: L.divIcon({ className: 'newpin', html: '<span></span>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
    NEW.layer.on('dragend', () => { NEW.latlng = NEW.layer.getLatLng(); NEW.acc = null; updateNewInfo(); });
  }
  showNewForm();
  setSheet('half');
  setTimeout(() => panToVisible(ll, Math.max(map.getZoom(), 17)), 250);   // chờ khung thông tin mở xong
}

function stopNew() {
  if (!NEW) return;
  const n = NEW;
  NEW = null;
  gtStop();
  map.pm.disableDraw();
  map.off('pm:create');
  if (n.layer) { if (n.layer.pm) n.layer.pm.disable(); map.removeLayer(n.layer); }
}
function cancelNew() { stopNew(); showList(); }

function newGeom() { return NEW && NEW.mode === 'poly' && NEW.layer ? NEW.layer.toGeoJSON().geometry : null; }
function newInfoText() {
  if (!NEW) return '';
  if (NEW.mode === 'poly') { const g = newGeom(); return g ? 'Polygon · diện tích đo ' + fmtHa(areaHa(g)) : ''; }
  const ll = NEW.latlng;
  return ll ? `Điểm ${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}` + (NEW.acc ? ` (GPS ±${NEW.acc} m)` : '') + ' · kéo điểm cam để chỉnh' : '';
}
function updateNewInfo() {
  if ($('#newInfo')) $('#newInfo').textContent = newInfoText();
  const g = newGeom();
  if (g && $('#nwArea') && !$('#nwArea').dataset.touched) $('#nwArea').value = (Math.round(areaHa(g) * 100) / 100).toString();
}

function nearestFarm(ll) {
  let best = null, bd = Infinity;
  DATA.lo.rows.forEach(p => {
    const l = layerById[p.id];
    const c = l ? (l.getBounds ? l.getBounds().getCenter() : l.getLatLng()) : (pointOf(p) ? L.latLng(pointOf(p)) : null);
    if (!c) return;
    const d = map.distance(ll, c);
    if (d < bd) { bd = d; best = p; }
  });
  const f = best && farmOf(best);
  return f ? { f, d: bd } : null;
}
function nextFarmId(base) {
  const m = String(base || '').match(/^(.*?)(\d+)$/);
  if (!m) return '';
  const pre = m[1], w = m[2].length;
  let max = 0;
  Object.keys(farms()).forEach(id => {
    if (id.indexOf(pre) !== 0) return;
    const rest = id.slice(pre.length);
    if (/^\d+$/.test(rest)) max = Math.max(max, Number(rest));
  });
  return pre + String(max + 1).padStart(w, '0');
}
function nextPlotId(farmId) {
  if (!farmId) return '';
  let max = 0;
  Object.keys(byId).forEach(id => {
    if (id.indexOf(farmId + '-') !== 0) return;
    const rest = id.slice(farmId.length + 1);
    if (/^\d+$/.test(rest)) max = Math.max(max, Number(rest));
  });
  return farmId + '-' + String(max + 1).padStart(2, '0');
}

function showNewForm() {
  const ll = NEW.mode === 'poly' ? NEW.layer.getBounds().getCenter() : NEW.latlng;
  const near = nearestFarm(ll);
  const nearTxt = near ? [near.f.props.HoDem, near.f.props.Ten].filter(Boolean).join(' ') : '';
  const newId = near ? nextFarmId(near.f.id) : '';
  const dl = (id, vals) => `<datalist id="${id}">` + vals.map(v => `<option value="${esc(v)}">`).join('') + '</datalist>';
  let h = `<button class="link" id="newCancel">✕ Hủy tạo mới</button><h2>Tạo lô mới</h2>
    <div class="stats" id="newInfo">${esc(newInfoText())}</div>
    <div class="field"><label for="nwFarm">Mã hộ <span class="req">*</span></label>
      <input type="text" id="nwFarm" list="nwFids" autocomplete="off" placeholder="Chọn hộ có sẵn hoặc nhập mã hộ mới">
      ${dl('nwFids', Object.keys(farms()))}</div>
    <div class="quick">
      ${near ? `<button type="button" id="nwNear">Hộ gần nhất: ${esc(near.f.id)}${nearTxt ? ' · ' + esc(nearTxt) : ''} (${Math.round(near.d)} m)</button>` : ''}
      ${newId ? `<button type="button" id="nwNewFarm">+ Hộ mới: ${esc(newId)}</button>` : ''}
    </div>
    <div class="muted" id="nwFarmInfo"></div>
    <div class="newfarm" id="nwFarmBox" hidden>
      <div class="muted" style="margin-bottom:8px">Hộ mới – điền thông tin cơ bản (các trường khác sửa sau trong khung thông tin):</div>
      <div class="field"><label for="nwHoDem">Họ đệm</label><input type="text" id="nwHoDem"></div>
      <div class="field"><label for="nwTen">Tên <span class="req">*</span></label><input type="text" id="nwTen"></div>
      <div class="field"><label for="nwXa">Xã/thôn</label><input type="text" id="nwXa" list="nwXas">${dl('nwXas', suggestValues('ho', { col: 'ThonXa' }))}</div>
      <div class="field"><label for="nwTinh">Tỉnh</label><input type="text" id="nwTinh" list="nwTinhs">${dl('nwTinhs', Array.from(new Set(['Lâm Đồng', 'Sơn La'].concat(suggestValues('ho', { col: 'Tinh' })))))}</div>
      <div class="muted" style="margin-bottom:8px">Hộ mới tự tick <b>RA</b>; nhóm 4C cập nhật theo danh sách.</div>
    </div>
    <div class="field"><label for="nwId">Mã lô <span class="req">*</span></label><input type="text" id="nwId" autocomplete="off"></div>
    <div class="field"><label for="nwArea">Diện tích khai báo (ha)</label><input type="text" id="nwArea" inputmode="decimal"></div>
    <div class="ferr" id="nwErr"></div>
    <div class="actions"><button id="nwOk" class="primary">Tạo lô</button><button id="nwCancel2">Hủy</button></div>`;
  $('#panelBody').innerHTML = h;
  $('#panel').scrollTop = 0;
  const near0 = near && near.d < 150 ? near.f.id : '';
  const refreshFarm = () => {
    const fid = $('#nwFarm').value.trim(), f = farms()[fid];
    $('#nwFarmBox').hidden = !fid || !!f;
    $('#nwFarmInfo').innerHTML = f ? 'Hộ có sẵn: <b>' + esc(farmName(f)) + '</b> ' + tagsHtml({ props: { [C.farm]: fid } }) : '';
    if (!$('#nwId').dataset.touched) $('#nwId').value = nextPlotId(fid);
  };
  $('#nwFarm').value = near0;
  refreshFarm();
  updateNewInfo();
  $('#nwFarm').addEventListener('input', refreshFarm);
  $('#nwId').addEventListener('input', () => { $('#nwId').dataset.touched = '1'; });
  $('#nwArea').addEventListener('input', () => { $('#nwArea').dataset.touched = '1'; });
  if ($('#nwNear')) $('#nwNear').onclick = () => { $('#nwFarm').value = near.f.id; delete $('#nwId').dataset.touched; refreshFarm(); };
  if ($('#nwNewFarm')) $('#nwNewFarm').onclick = () => {
    $('#nwFarm').value = newId; delete $('#nwId').dataset.touched; refreshFarm();
    if (near && $('#nwXa') && !$('#nwXa').value) $('#nwXa').value = near.f.props.ThonXa || '';
    if (near && $('#nwTinh') && !$('#nwTinh').value) $('#nwTinh').value = near.f.props.Tinh || '';
    $('#nwTen').focus();
  };
  $('#newCancel').onclick = cancelNew;
  $('#nwCancel2').onclick = cancelNew;
  $('#nwOk').onclick = submitNew;
}

async function submitNew() {
  const err = m => { $('#nwErr').textContent = m; toast(m, 6000); };
  const farmId = $('#nwFarm').value.trim(), id = $('#nwId').value.trim();
  if (!NEW || (NEW.mode === 'poly' ? !NEW.layer : !NEW.latlng)) return err('Chưa có vị trí / polygon.');
  if (!farmId) return err('Nhập mã hộ.');
  if (!id) return err('Nhập mã lô.');
  if (byId[id]) return err('Mã lô ' + id + ' đã có.');
  const isNewFarm = !farms()[farmId];
  if (isNewFarm && !$('#nwTen').value.trim()) return err('Hộ mới: nhập tên chủ hộ.');
  const area = $('#nwArea').value.trim();
  if (area && isNaN(numOf(area))) return err('Diện tích phải là số.');
  const programs = {};
  document.querySelectorAll('[data-nprog]').forEach(el => { programs[el.dataset.nprog] = el.checked; });
  const item = { id, farmId, area, programs,
    geometry: newGeom(),
    lat: NEW.mode === 'point' ? NEW.latlng.lat : null, lon: NEW.mode === 'point' ? NEW.latlng.lng : null,
    farm: isNewFarm ? { HoDem: $('#nwHoDem').value.trim(), Ten: $('#nwTen').value.trim(),
      ThonXa: $('#nwXa').value.trim(), Tinh: $('#nwTinh').value.trim() } : null };
  busy(true);
  $('#nwOk').disabled = true;
  try {
    const r = await call('createPlot', item);
    farms()[r.ho.id] = r.ho;
    replacePlot(r.lo);
    stopNew();
    renderChips();
    sel = r.lo.id;
    renderLayers();
    showPlot(sel, true);
    toast(`Đã tạo lô ${r.lo.id}` + (r.newFarm ? ` và hộ mới ${r.ho.id}` : '') + ' ✓', 5000);
  } catch (e) {
    err('Không tạo được: ' + (e.message || e));
    if ($('#nwOk')) $('#nwOk').disabled = false;
  } finally {
    busy(false);
  }
}

// ---------- Sự kiện ----------
$('#q').addEventListener('focus', () => { if (isMobile()) setSheet('full'); });
$('#q').addEventListener('input', () => {
  if (!DATA || hasUnsaved()) return;
  if (sel) { sel = null; renderLayers(); }
  showList();
});
$('#btnReload').onclick = () => { if (confirmDiscard()) load(true); };
$('#btnExport').onclick = doExport;
$('#btnImport').onclick = () => {
  if (!DATA) return;
  if (!DATA.user.canEdit) { toast('Tài khoản của bạn chỉ có quyền xem.'); return; }
  if (!confirmDiscard()) return;
  $('#file').value = '';
  $('#file').click();
};
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const feats = parseKml(await readKmlFile(f));
    if (!feats.length) throw new Error('Không tìm thấy polygon nào trong file.');
    openImport(feats, f.name);
  } catch (err) {
    toast('Không đọc được file: ' + (err.message || err), 9000);
  }
});
$('#mAllowNew').addEventListener('change', refreshImportStatus);
$('#mOk').onclick = doImport;
$('#mCancel').onclick = closeModal;
$('#mClose').onclick = closeModal;
window.addEventListener('beforeunload', e => { if (hasUnsaved()) { e.preventDefault(); e.returnValue = ''; } });

// Tự làm mới mỗi 2 phút để thấy thay đổi của người khác (khi không đang sửa)
setInterval(() => {
  if (DATA && !hasUnsaved() && $('#modal').hidden && document.visibilityState === 'visible') load(true);
}, 120000);

if (store.get(TOKEN_KEY)) load(false); else showLogin();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
