<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dự án NT</title>
<meta name="theme-color" content="#0b6b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dự án NT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
<style>
  :root {
    --bg: #ffffff; --fg: #1d2329; --muted: #66727d; --line: #dde3e8; --soft: #f3f6f8;
    --accent: #0b7a53; --accent-fg: #ffffff; --warn: #b3541e; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b20; --fg: #e8edf1; --muted: #9aa6b1; --line: #2c343c; --soft: #1f262d;
      --accent: #3ccf91; --accent-fg: #0b1a13; --warn: #f0a35e; --err: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #login { position: fixed; inset: 0; z-index: 5000; background: var(--bg); display: flex; align-items: center;
    justify-content: center; padding: 24px; }
  #login[hidden] { display: none; }
  #login form { width: 100%; max-width: 360px; display: grid; gap: 12px; }
  #login h1 { margin: 0 0 4px; font-size: 22px; text-align: center; letter-spacing: .02em; color: #0b5a22; }
  #login form > .muted { text-align: center; }
  #login input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--fg); }
  #login button { min-height: 48px; font-size: 16px; }
  #login .err { min-height: 1.2em; font-size: 14px; }
  #login .logo { width: 72px; height: 72px; border-radius: 18px; justify-self: center; }
  .logout { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0 !important; font-size: 13px; }
  @media (max-width: 760px) {
    #bar { padding-top: calc(8px + env(safe-area-inset-top)); }
    #gps { top: calc(62px + env(safe-area-inset-top)); }
    .leaflet-top { top: calc(56px + env(safe-area-inset-top)); }
    #panel[data-state="full"] { height: calc(100dvh - 64px - env(safe-area-inset-top)); }
  }
  #app { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; height: 100vh; }
  #bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px;
    border-bottom: 1px solid var(--line); }
  #q { flex: 1 1 200px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); font: inherit; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--soft); color: var(--fg); cursor: pointer; font-size: 13px; }
  .chip.off { opacity: .5; }
  .chip .tick { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--muted); font-size: 12px; font-weight: 700; color: #fff; }
  .chip.on .tick { background: var(--accent); border-color: var(--accent); }
  .chips-t { font-size: 13px; color: var(--muted); align-self: center; }
  .dl { display: grid; gap: 10px; padding: 12px 0 4px; }
  .dl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .dl-t { display: flex; align-items: center; gap: 8px; }
  .dl-b { display: flex; gap: 8px; flex-wrap: wrap; }
  .gpsdlg { padding: 6px 0 4px; line-height: 1.5; }
  .gpsdlg p { margin: 8px 0; }
  .gpsdlg .steps { margin: 8px 0; padding-left: 22px; }
  .gpsdlg .steps li { margin: 6px 0; }
  .gpsdlg-b { display: flex; gap: 10px; margin-top: 14px; }
  .gpsdlg-b button { flex: 1; min-height: 46px; font-size: 16px; }
  .dl-save { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 6px; }
  .dl-save button { min-height: 44px; }
  .dl-hint { display: block; font-size: 13px; }
  .eudr-legend { background: var(--bg); color: var(--fg); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.6;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .eudr-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
  #map { min-height: 0; }
  #panel { border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px 24px; }
  #btnMenu, #grab { display: none; }
  #gps { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: 10px; max-width: 92%;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gps[hidden] { display: none; }
  #geoBar { position: absolute; z-index: 1001; left: 50%; transform: translateX(-50%); top: 10px; display: flex;
    align-items: center; gap: 10px; padding: 5px 5px 5px 14px; background: var(--bg); color: var(--fg);
    border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.3); white-space: nowrap; max-width: 94%; }
  #geoBar[hidden] { display: none; }
  /* Đỉnh polygon khi vẽ/sửa: to, dễ thấy; vùng bấm rộng hơn hình vẽ (vòng trong suốt bao quanh) */
  .leaflet-container .marker-icon { width: 16px !important; height: 16px !important; margin: -8px 0 0 -8px !important;
    background: #ffd400 !important; border: 2px solid #fff !important; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.55);
    box-sizing: border-box; }
  .leaflet-container .marker-icon::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; }
  .leaflet-container .marker-icon-middle { width: 12px !important; height: 12px !important; margin: -6px 0 0 -6px !important;
    background: rgba(255,255,255,.85) !important; border: 2px solid #ffd400 !important; opacity: .9; box-shadow: none; }
  .leaflet-container .marker-icon-middle::before { inset: -8px; }
  .leaflet-container .marker-icon.leaflet-drag-target, .leaflet-container .marker-icon:active { transform-origin: center; }
  @media (pointer: coarse) {
    .leaflet-container .marker-icon { width: 20px !important; height: 20px !important; margin: -10px 0 0 -10px !important; }
    .leaflet-container .marker-icon::before { inset: -14px; }
    .leaflet-container .marker-icon-middle { width: 14px !important; height: 14px !important; margin: -7px 0 0 -7px !important; }
    .leaflet-container .marker-icon-middle::before { inset: -9px; }
  }
  #geoBar .lbl { font-size: 12px; color: var(--muted, #64748b); }
  #geoArea { font-size: 18px; }
  #geoUndo { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--soft); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  #geoUndo:disabled { opacity: .4; cursor: default; }
  #mapWrap.editing #gps { display: none; }
  #gps b { color: var(--accent); }
  .locate a { font-size: 20px; line-height: 30px !important; }
  .locate.on a { color: #1a73e8 !important; }
  .locate.follow a { background: #1a73e8 !important; color: #fff !important; }
  #mapWrap { position: relative; min-height: 0; }
  #mapWrap #map { position: absolute; inset: 0; }

  /* ---------- Điện thoại ---------- */
  @media (max-width: 760px) {
    #app { display: block; position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
    #mapWrap { position: absolute; inset: 0; }
    #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1002; border: 0; padding: 8px;
      background: transparent; pointer-events: none; }
    #bar > * { pointer-events: auto; }
    #q { flex: 1 1 auto; height: 42px; font-size: 16px; border-radius: 21px; padding: 0 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    #btnMenu { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px;
      border-radius: 21px; padding: 0; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.25); background: var(--bg);
      flex: none; color: var(--fg, #1d2329); }
    #btnMenu svg { display: block; }
    #bar #chips, #bar .tool { display: none; }
    #bar.open { background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    #bar.open #chips { display: flex; flex-wrap: wrap; width: 100%; order: 3; padding-bottom: 2px; }
    #bar.open .chips-t { width: 100%; }
    #bar.open .tool { display: inline-flex; order: 4; flex: 1; justify-content: center; min-height: 44px; }
    .chip { padding: 8px 12px; flex: none; }
    #busy { position: absolute; right: 64px; top: 22px; }
    #gps { top: 62px; }
    #geoBar { top: 62px; }
    .leaflet-top { top: 56px; }
    .leaflet-control-zoom { display: none; }
    .leaflet-touch .leaflet-bar a { width: 38px; height: 38px; line-height: 38px !important; }
    .leaflet-touch .leaflet-control-layers-toggle { width: 38px; height: 38px; background-size: 22px; }
    .leaflet-right .leaflet-control { margin-right: 8px; }
    .leaflet-top .leaflet-control { margin-top: 8px; }
    .locate a { font-size: 17px; }
    .addctl a { font-size: 22px; }
    .northctl svg { width: 19px; height: 19px; }
    #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1001; border: 0; padding: 0 14px 0;
      background: var(--bg); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.3);
      height: 52vh; height: 52dvh; transition: height .28s cubic-bezier(.2, .8, .2, 1); overflow: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch; will-change: height; }
    #panel.dragging { transition: none; }
    #panel[data-state="peek"] { height: 96px; overflow: hidden; }
    #panel[data-state="full"] { height: calc(100vh - 64px); height: calc(100dvh - 64px); }
    #grab { display: block; position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 12px 0 10px;
      margin: 0 -14px; text-align: center; cursor: grab; touch-action: none; }
    #grab::before { content: ''; display: inline-block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
    #panelBody { padding-bottom: 16px; }
    .field input[type=text], .field select, .field input[type=date] { font-size: 16px; min-height: 44px; }
    button { min-height: 40px; }
    button.link { min-height: 32px; }
    .prog { padding: 10px 14px; }
    .item { padding: 12px 4px; }
    .actions { bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
    .actions button { flex: 1; min-height: 48px; }
    .sheet { max-height: 85vh; }
    .btxt { display: inline; }
  }
  @media (min-width: 761px) { .btxt.mob { display: none; } }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--soft); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--err); }
  button.link { border: 0; background: none; padding: 4px 0; color: var(--accent); }
  h2 { margin: 6px 0 4px; font-size: 18px; }
  h3 { margin: 18px 0 8px; font-size: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .stats { background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
  .field { display: grid; gap: 3px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type=text] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; width: 100%; }
  .field input[readonly] { background: var(--soft); color: var(--muted); }
  .field.check { display: flex; align-items: center; gap: 8px; }
  .field.check label { font-size: 14px; color: var(--fg); }
  .field.changed input[type=text] { border-color: var(--accent); }
  .field select, .field input[type=date] { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; width: 100%; }
  .field.changed select, .field.changed input[type=date] { border-color: var(--accent); }
  .field.bad input, .field.bad select { border-color: var(--err) !important; }
  .field .req { color: var(--err); }
  .field .fhint { font-size: 11px; color: var(--muted); }
  .field .ferr { font-size: 12px; color: var(--err); }
  .field .calc { padding: 7px 9px; border-radius: 6px; background: var(--soft); color: var(--muted); }
  details.grp { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; margin: 10px 0; }
  details.grp > summary { font-weight: 600; color: var(--fg); margin: 0; padding: 9px 0; list-style-position: inside; }
  details.grp[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  #checks { margin: 8px 0; }
  .who { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .codes { font-size: 14px; margin: 2px 0 8px; display: grid; gap: 2px; }
  .mainf { margin-top: 10px; }
  .more-btn { width: 100%; margin: 6px 0 10px; background: var(--bg); color: var(--accent); font-weight: 600; }
  .grp { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px 2px; margin: 10px 0; }
  .grp-t { font-weight: 600; padding: 9px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .lastedit { margin: -2px 0 10px; font-size: 13px; line-height: 1.4; }
  .plabel { background: none; border: 0; }
  .plabel span { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; color: #fff; font: 600 12px/1.2 system-ui, sans-serif;
    text-shadow: 0 0 3px #000, 0 0 2px #000, 0 1px 2px #000; pointer-events: none; }
  #checks .ck { font-size: 13px; padding: 6px 9px; border-radius: 6px; margin-bottom: 5px; border-left: 4px solid; }
  #checks .ck.err { border-color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); color: var(--fg); }
  #checks .ck.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  #checks .ck.ok { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #checks .ck.info { border-color: var(--line); background: var(--soft); color: var(--muted); }
  .progs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
  .prog { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-weight: 600; }
  .prog input { width: 18px; height: 18px; margin: 0; }
  .prog.changed { border-color: var(--accent); }
  .prog.ro { cursor: default; opacity: .55; font-weight: 500; }
  .prog.ro.on { opacity: 1; font-weight: 700; }
  details summary { cursor: pointer; color: var(--accent); margin: 4px 0 10px; }
  .actions { position: sticky; bottom: -24px; background: var(--bg); padding: 10px 0; display: flex; gap: 8px;
    border-top: 1px solid var(--line); z-index: 2; }
  .item { padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--soft); }
  .item b { display: block; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-right: 4px;
    color: #10161b; font-weight: 600; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px;
    border: 1px solid currentColor; margin-left: 6px; font-weight: 400; }
  .badge.warn { color: var(--warn); }
  .badge.err { color: var(--err); }
  .hint { font-size: 12px; color: var(--muted); background: var(--soft); padding: 8px; border-radius: 6px; }
  .err { color: var(--err); }
  a { color: var(--accent); }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end;
    justify-content: center; z-index: 2000; }
  #modal[hidden] { display: none; }
  .sheet { background: var(--bg); width: 100%; max-width: 900px; max-height: 72vh; border-radius: 12px 12px 0 0;
    display: flex; flex-direction: column; }
  .sheet header, .sheet footer { padding: 12px 14px; display: flex; gap: 8px; align-items: center; }
  .sheet header { border-bottom: 1px solid var(--line); justify-content: space-between; }
  .sheet footer { border-top: 1px solid var(--line); justify-content: flex-end; flex-wrap: wrap; }
  .sheet .body { overflow: auto; padding: 0 14px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td input[type=text] { width: 100%; min-width: 110px; padding: 5px 7px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  td.name { cursor: pointer; text-decoration: underline dotted; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw;
    background: #222; color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 3000; display: none; }
  #busy { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; visibility: hidden; flex: none; }
  #busy.on { visibility: visible; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Ảnh mảnh vườn */
  .photos { margin: 2px 0 14px; }
  .ph-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .ph-grid:empty { display: none; }
  .ph { padding: 0; aspect-ratio: 1; overflow: hidden; border-radius: 8px; min-height: 0 !important; font-size: 22px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-add { width: 100%; margin-top: 8px; font-weight: 600; color: var(--accent); background: var(--bg); }
  .ph-src { margin: 8px 0 0; }
  .ph-src button { flex: 1; }
  .ph-view { text-align: center; padding-top: 12px; }
  .ph-view img { max-width: 100%; max-height: 58vh; border-radius: 8px; background: var(--soft); }
  /* Nút + và tạo lô mới */
  .addctl a { font-size: 26px; font-weight: 600; line-height: 28px !important; }
  .northctl a { display: flex !important; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
  .northctl svg { width: 22px; height: 22px; transition: transform .15s; }
  .northctl.off { display: none; }
  .headcone { pointer-events: none; }
  .headcone svg { display: block; transition: transform .12s linear; }
  .addmenu { display: grid; gap: 8px; padding: 12px 0 4px; }
  .addmenu button { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 2px 8px; text-align: left;
    white-space: normal; padding: 12px 14px; font-size: 15px; }
  .addmenu .ic { grid-row: span 2; font-size: 22px; text-align: center; }
  #mFoot[hidden] { display: none; }
  .qpin span { display: block; width: 18px; height: 18px; border-radius: 50%; background: #e53935; border: 3px solid #fff; box-shadow: 0 0 0 2px #e53935, 0 1px 4px rgba(0,0,0,.4); }
  .item.coord { border-left: 4px solid #e53935; }
  .newpin span { display: block; width: 22px; height: 22px; border-radius: 50%; background: #ff7a00; border: 3px solid #fff;
    box-shadow: 0 0 0 2px #ff7a00, 0 2px 6px rgba(0,0,0,.5); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 10px; }
  .quick button { font-size: 13px; padding: 5px 10px; min-height: 0 !important; white-space: normal; text-align: left; }
  .newfarm { border: 1px dashed var(--warn); border-radius: 8px; padding: 8px 10px 2px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <input id="q" type="search" placeholder="Tìm tên chủ hộ, mã vườn hoặc tọa độ…">
    <button id="btnMenu" title="Bộ lọc và công cụ" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
    <div id="chips"></div>
    <div id="busy"></div>
    <button id="btnImport" class="tool" title="Nhập ranh giới từ file KML/KMZ">⬆ <span class="btxt">Nhập KML</span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
